name: Sync skill references
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
permissions:
  contents: read
concurrency:
  group: sync-skill-references-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate:
    if: github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted base tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out PR input as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: incoming
          persist-credentials: false
      - name: Check trusted generation tooling
        id: generator
        run: |
          unchanged=true
          for source in scripts/sync-skills.mjs scripts/ci/skill-reference-changes.mjs; do
            if ! git -C trusted cat-file -e "HEAD:$source" 2>/dev/null; then
              unchanged=false
              break
            fi
            trusted_blob=$(git -C trusted rev-parse "HEAD:$source")
            incoming_blob=$(git -C incoming rev-parse "HEAD:$source")
            if [ "$trusted_blob" != "$incoming_blob" ]; then
              unchanged=false
              break
            fi
          done
          if [ "$unchanged" = 'true' ]; then
            echo 'unchanged=true' >> "$GITHUB_OUTPUT"
          else
            echo 'unchanged=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' '## Reference tooling needs review' '' \
              'This PR introduces or changes generation tooling that is not yet available in its trusted base.' \
              'Run `just sync-skills`, commit the generated references, and let ordinary CI verify them.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install trusted tooling dependencies without lifecycle scripts
        if: steps.generator.outputs.unchanged == 'true'
        run: bun install --cwd trusted --ignore-scripts
      - name: Generate references from inert PR documents
        if: steps.generator.outputs.unchanged == 'true'
        run: node trusted/scripts/sync-skills.mjs --root "$GITHUB_WORKSPACE/incoming"
      - name: Prepare generated changes
        if: steps.generator.outputs.unchanged == 'true'
        id: prepare
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKILL_REFERENCE_RUN_ID: ${{ github.run_id }}
          SKILL_REFERENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git -C incoming add -- ':(glob)skills/*/reference/**'
          changes=$(node trusted/scripts/ci/skill-reference-changes.mjs prepare "$GITHUB_WORKSPACE/incoming" "$PR_HEAD_SHA" "$RUNNER_TEMP/skill-references.json")
          if [ "$changes" = '0' ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain prepared reference data
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skill-references-${{ github.event.pull_request.head.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-references.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false
