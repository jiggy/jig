name: Evaluator batching A/B diagnostic

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Bun test tool
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Provision ephemeral rootless host
        run: scripts/ci/provision-github-rootless-host.sh provision

      - name: Download and verify the two frozen host archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ab_root=$(mktemp -d /tmp/jig-evaluator-ab.XXXXXX)
          printf 'JIG_AB_ROOT=%s\n' "$ab_root" >> "$GITHUB_ENV"
          mkdir "$ab_root/before" "$ab_root/after"
          gh run download 36350362826 --repo jiggy/jig \
            --name linux-host-artifacts-bc4472cb42e1ba66bdaa5e44bc8e3f65d9dd9843 \
            --dir "$ab_root/before"
          gh run download 36379108372 --repo jiggy/jig \
            --name linux-host-artifacts-26c521d5ca309269cb03b45167f585fff97f02d7 \
            --dir "$ab_root/after"
          (cd "$ab_root/before" && sha256sum --check SHA256SUMS)
          (cd "$ab_root/after" && sha256sum --check SHA256SUMS)

      - name: Compare installed reviews on the same host
        env:
          JIG_CI_BUN: ${{ steps.setup-bun.outputs.bun-path }}
        run: >-
          scripts/ci/provision-github-rootless-host.sh run-delegated
          "$JIG_CI_BUN" scripts/profile-evaluator-batching-ab.ts "$JIG_AB_ROOT"

      - name: Assert no Jig-owned host residue
        if: always()
        run: scripts/ci/provision-github-rootless-host.sh assert-clean

      - name: Retain bounded comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluator-batching-ab-${{ github.run_id }}
          path: |
            ${{ env.JIG_AB_ROOT }}/results.json
            ${{ env.JIG_AB_ROOT }}/projects/*/review-profile.jsonl
          if-no-files-found: warn
          retention-days: 7
