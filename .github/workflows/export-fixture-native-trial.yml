name: Installed export observer native trial
on:
  push:
    branches:
      - trial/export-fixture-sqlite-busy
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: "1.43.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: "1.4.4"
      - run: bun install --ignore-scripts
      - run: just jig::build
      - name: Provision the normal rootless Linux host
        id: host
        env:
          JIG_CI_BUN: ${{ steps.bun.outputs.bun-path }}
        run: |
          scripts/ci/provision-github-rootless-host.sh provision
          printf 'JIG_CI_BUN=%s\n' "$JIG_CI_BUN" >> "$GITHUB_ENV"
      - name: Prepare ordinary candidate archives before host entry
        run: |
          archive_directory="$RUNNER_TEMP/retained-packet-archives"
          mkdir "$archive_directory"
          bun packages/jig/scripts/pack.ts --destination "$archive_directory"
          flow_version=$(node -p 'require("./packages/jig/package.json").devDependencies["@jigging/flow"]')
          flow_archive=$(npm pack "@jigging/flow@$flow_version" --ignore-scripts --pack-destination "$archive_directory" --silent)
          shopt -s nullglob
          jig_archives=("$archive_directory"/jigging-jig-*.tgz)
          test "${#jig_archives[@]}" = 1
          printf 'JIG_PACKAGE_ARCHIVE=%s\n' "${jig_archives[0]}" >> "$GITHUB_ENV"
          printf 'FLOW_SDK_PACKAGE_ARCHIVE=%s/%s\n' "$archive_directory" "$flow_archive" >> "$GITHUB_ENV"
      - name: Repeat packed CLI recovery three times
        run: |
          set -euo pipefail
          for iteration in 1 2 3; do
            printf 'Installed recovery iteration %s\n' "$iteration"
            scripts/ci/provision-github-rootless-host.sh run-acquisition-host env \
              JIG_LINUX_ROOTLESS_HOSTILE=1 \
              "JIG_PACKAGE_ARCHIVE=$JIG_PACKAGE_ARCHIVE" "FLOW_SDK_PACKAGE_ARCHIVE=$FLOW_SDK_PACKAGE_ARCHIVE" \
              "JIG_AUTHORING_NODE_PATH=$(command -v node)" \
              "$JIG_CI_BUN" test packages/jig/test/host/installed-attempt-export.test.ts
            scripts/ci/provision-github-rootless-host.sh assert-clean
          done
      - name: Check for execution residue
        if: ${{ always() && steps.host.outcome == 'success' }}
        run: scripts/ci/provision-github-rootless-host.sh assert-clean
