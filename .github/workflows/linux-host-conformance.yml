name: Linux host conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-host-conformance.yml"
      - "packages/jig/**"
      - "package.json"
      - "scripts/ci/provision-github-rootless-host.sh"
      - "scripts/test-installed-hostile-baseline.ts"
      - "scripts/test-operational-baseline.ts"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: linux-host-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootless-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.43.1'

      - name: Install exact Bun build tool
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Retain the exact Bun executable
        env:
          JIG_CI_BUN: ${{ steps.setup-bun.outputs.bun-path }}
        run: printf 'JIG_CI_BUN=%s\n' "$JIG_CI_BUN" >> "$GITHUB_ENV"

      - name: Provision and preflight the ephemeral host
        run: scripts/ci/provision-github-rootless-host.sh provision

      - name: Install Jig workspace build dependencies
        run: bun install --ignore-scripts --filter @jigging/jig

      - name: Build and pack once
        shell: bash
        run: |
          set -euo pipefail
          just --justfile packages/jig/justfile build
          artifact_directory="$RUNNER_TEMP/jig-artifact"
          mkdir "$artifact_directory"
          (
            cd packages/jig
            bun pm pack --ignore-scripts --destination "$artifact_directory"
          )
          mapfile -t archives < <(find "$artifact_directory" -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "packing did not produce exactly one Jig archive" >&2
            exit 1
          fi
          archive=$(readlink -f "${archives[0]}")
          sha256sum "$archive"
          printf 'JIG_PACKAGE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Prove transient delegation and lifetime fencing
        run: >-
          scripts/ci/provision-github-rootless-host.sh run-delegated
          env JIG_LINUX_ROOTLESS_HOSTILE=1
          "$JIG_CI_BUN" test packages/jig/test/linux-rootless-delegation-hostile.test.ts
          --timeout 30000

      - name: Prove the rootless Run envelope
        run: >-
          scripts/ci/provision-github-rootless-host.sh run-delegated
          env JIG_LINUX_ROOTLESS_HOSTILE=1
          "$JIG_CI_BUN" test packages/jig/test/linux-rootless-run.test.ts
          --timeout 30000

      - name: Prove contained native preparation
        run: >-
          scripts/ci/provision-github-rootless-host.sh run-delegated
          env JIG_LINUX_ROOTLESS_HOSTILE=1
          "$JIG_CI_BUN" test packages/jig/test/bun-native-preparation.test.ts
          --timeout 120000

      - name: Prove the finite foreground product path
        run: >-
          scripts/ci/provision-github-rootless-host.sh run-delegated
          env JIG_LINUX_ROOTLESS_HOSTILE=1
          "$JIG_CI_BUN" test packages/jig/test/private-foreground.test.ts
          --timeout 30000

      - name: Prove the deterministic Agent lifecycle
        run: >-
          scripts/ci/provision-github-rootless-host.sh run-delegated
          env JIG_LINUX_ROOTLESS_HOSTILE=1
          "$JIG_CI_BUN" test packages/jig/test/root-agent-run-lifecycle.test.ts
          --timeout 180000

      - name: Run Operational Baseline/1 against the packed archive
        run: >-
          scripts/ci/provision-github-rootless-host.sh run-acquisition-host
          env "JIG_PACKAGE_ARCHIVE=$JIG_PACKAGE_ARCHIVE"
          "$JIG_CI_BUN" scripts/test-operational-baseline.ts

      - name: Attack the packed CLI inside the proved envelope
        run: >-
          scripts/ci/provision-github-rootless-host.sh run-acquisition-host
          env "JIG_PACKAGE_ARCHIVE=$JIG_PACKAGE_ARCHIVE"
          "$JIG_CI_BUN" scripts/test-installed-hostile-baseline.ts

      - name: Require zero host residue
        if: always()
        run: scripts/ci/provision-github-rootless-host.sh assert-clean
