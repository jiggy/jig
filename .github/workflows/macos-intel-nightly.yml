name: Intel Mac compatibility
'on':
  schedule:
  - cron: 23 2 * * *
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional PR number for full Intel qualification
        type: string
        default: ''
      include_startup_profile:
        description: Optional installed Intel startup profile (up to 30 minutes)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: intel-compatibility
  cancel-in-progress: false
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      shards: ${{ steps.targets.outputs.shards }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - id: targets
      name: Select latest published version and exact main candidate
      env:
        GH_TOKEN: ${{ github.token }}
        INTEL_PULL_REQUEST: ${{ inputs.pull_request }}
      run: node scripts/ci/intel-nightly.mjs select
  host-artifacts:
    name: Intel inputs — ${{ matrix.label }}
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.targets) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - name: Acquire immutable compatibility input
      env:
        GH_TOKEN: ${{ github.token }}
        INTEL_TARGET: ${{ toJSON(matrix) }}
      run: node scripts/ci/intel-nightly.mjs acquire "$RUNNER_TEMP/macos-host-artifacts"
    - name: Retain verified compatibility input for the next nightly
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: intel-inputs-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/macos-host-artifacts
        retention-days: 14
        if-no-files-found: error
  prerequisites:
    name: Intel shard — ${{ matrix.label }} / ${{ matrix.shard }}
    runs-on: macos-15-intel
    timeout-minutes: ${{ matrix.installed && inputs.include_startup_profile && 65 || 35 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.sha }}
        path: policy
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ matrix.source }}
        path: candidate
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: intel-inputs-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/macos-host-artifacts
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      with:
        just-version: 1.43.1
    - name: Record exact host and verify native process prerequisites
      env:
        EXPECTED_ARCH: ${{ matrix.arch }}
        SOURCE_REVISION: ${{ matrix.source }}
      run: |
        set -o pipefail
        mkdir -p "$RUNNER_TEMP/mac-evidence"
        git rev-parse HEAD > "$RUNNER_TEMP/mac-evidence/source.txt"
        uname -a > "$RUNNER_TEMP/mac-evidence/host.txt"
        sw_vers >> "$RUNNER_TEMP/mac-evidence/host.txt"
        xcrun --show-sdk-version >> "$RUNNER_TEMP/mac-evidence/host.txt"
        bun -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw Error("incorrect native architecture")'
        bun scripts/ci/probe-macos-host.ts --hosted | tee "$RUNNER_TEMP/mac-evidence/prerequisites.json"
    - name: Compile the native launcher and validate SDK descriptor layouts
      run: |
        set -o pipefail
        clang -Wall -Wextra -Werror -Wno-deprecated-declarations packages/jig/support/macos-exec.c -o "$RUNNER_TEMP/mac-evidence/macos-exec"
        clang -Wall -Wextra -Werror packages/jig/test/fixtures/macos-file-abi.c -o "$RUNNER_TEMP/mac-evidence/file-abi"
        "$RUNNER_TEMP/mac-evidence/file-abi" | tee "$RUNNER_TEMP/mac-evidence/file-abi.txt"
        file "$RUNNER_TEMP/mac-evidence/macos-exec" >> "$RUNNER_TEMP/mac-evidence/host.txt"
      env:
        SOURCE_REVISION: ${{ matrix.source }}
    - name: Install build dependencies without lifecycle scripts
      run: bun install --ignore-scripts
      env:
        SOURCE_REVISION: ${{ matrix.source }}
    - name: Build the source-test workspace packages
      run: just --justfile packages/jig/justfile build
      env:
        SOURCE_REVISION: ${{ matrix.source }}
    - name: Verify exact canonical publication archives
      run: |
        set -eu
        node scripts/ci/candidate-provenance.mjs verify "$RUNNER_TEMP/macos-host-artifacts" --source "$SOURCE_REVISION"
        printf 'JIG_CI_CANDIDATE_DIRECTORY=%s\n' "$RUNNER_TEMP/macos-host-artifacts" >> "$GITHUB_ENV"
        cp "$RUNNER_TEMP/macos-host-artifacts/CANDIDATE.json" "$RUNNER_TEMP/mac-evidence/CANDIDATE.json"
        cp "$RUNNER_TEMP/macos-host-artifacts/ARTIFACT.json" "$RUNNER_TEMP/mac-evidence/ARTIFACT.json"
      env:
        SOURCE_REVISION: ${{ matrix.source }}
    - name: Test native containment and recovery
      if: matrix.shard == 0
      env:
        JIG_MACOS_PROCESS_TEST: '1'
        SOURCE_REVISION: ${{ matrix.source }}
      run: |
        set -o pipefail
        snapshot() {
          { launchctl list | awk 'NR > 1 && $3 ~ /^org\.jig\./ {print "job " $3}'; mount | awk '/jig-| on \/Volumes\/Jig-/ {print "mount " $0}'; } | LC_ALL=C sort
        }
        snapshot > "$RUNNER_TEMP/mac-evidence/before-native.txt"
        status=0
        bun test packages/jig/test/macos/macos-process-controls.test.ts packages/jig/test/macos/macos-execution.test.ts packages/jig/test/macos/macos-descriptor-files.test.ts packages/jig/test/macos/macos-descriptor-handoff.test.ts packages/jig/test/macos/macos-volume.test.ts packages/jig/test/macos/macos-backend-state.test.ts packages/jig/test/macos/macos-native-backend.test.ts packages/jig/test/macos/macos-guardian.test.ts --bail=1 --timeout 420000 --reporter=junit --reporter-outfile="$RUNNER_TEMP/mac-evidence/native-tests.xml" 2>&1 | tee "$RUNNER_TEMP/mac-evidence/native-tests.txt" || status=$?
        snapshot > "$RUNNER_TEMP/mac-evidence/after-native.txt"
        diff -u "$RUNNER_TEMP/mac-evidence/before-native.txt" "$RUNNER_TEMP/mac-evidence/after-native.txt" || status=1
        exit "$status"
    - name: Prepare genuine pinned clients for offline startup and refusal checks
      if: matrix.installed
      run: bun scripts/ci/install-macos-test-clients.ts "$RUNNER_TEMP/jig-native-clients" >> "$GITHUB_ENV"
      env:
        SOURCE_REVISION: ${{ matrix.source }}
    - name: Qualify the complete rootless host and installed consumer
      env:
        JIG_MACOS_TEST_TIMINGS_DIRECTORY: ${{ runner.temp }}/mac-evidence
        JIG_STARTUP_PROFILE_DIRECTORY: ${{ matrix.installed && inputs.include_startup_profile && format('{0}/mac-startup-profile', runner.temp) || '' }}
        SOURCE_REVISION: ${{ matrix.source }}
      run: |
        set -o pipefail
        scripts/ci/qualify-macos-host.sh --shard "${{ matrix.shard }}" 2>&1 | tee "$RUNNER_TEMP/mac-evidence/host-conformance.txt"
    - name: Verify canonical candidate metadata is unchanged
      if: always()
      run: |
        set -eu
        node scripts/ci/candidate-provenance.mjs verify "$RUNNER_TEMP/macos-host-artifacts" --source "$SOURCE_REVISION"
        cmp "$RUNNER_TEMP/mac-evidence/CANDIDATE.json" "$RUNNER_TEMP/macos-host-artifacts/CANDIDATE.json"
        cmp "$RUNNER_TEMP/mac-evidence/ARTIFACT.json" "$RUNNER_TEMP/macos-host-artifacts/ARTIFACT.json"
      env:
        SOURCE_REVISION: ${{ matrix.source }}
    - name: Record successful shard
      run: printf '%s %s %s\n' '${{ matrix.source }}' '${{ matrix.arch }}' '${{ matrix.shard }}' > "$RUNNER_TEMP/mac-evidence/shard-${{ matrix.shard }}.complete"
      env:
        SOURCE_REVISION: ${{ matrix.source }}
    - name: Retain candidate prerequisite evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-prerequisites-${{ matrix.arch }}-${{ matrix.shard }}-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/mac-evidence/*.txt
          ${{ runner.temp }}/mac-evidence/*.json
          ${{ runner.temp }}/mac-evidence/*.xml
          ${{ runner.temp }}/mac-evidence/*.complete
        retention-days: 7
    - name: Retain optional installed startup profile
      if: ${{ always() && matrix.installed && inputs.include_startup_profile }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-startup-profile-${{ matrix.arch }}-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/mac-startup-profile
        if-no-files-found: ignore
        retention-days: 7
    needs:
    - select
    - host-artifacts
    if: ${{ always() && needs.select.result == 'success' }}
    defaults:
      run:
        working-directory: candidate
  qualified-architecture:
    name: Intel qualification — ${{ matrix.label }}
    if: ${{ always() && needs.select.result == 'success' }}
    needs:
    - select
    - host-artifacts
    - prerequisites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.targets) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.sha }}
        path: policy
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ matrix.source }}
        path: candidate
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - name: Download this architecture's shard evidence
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: macos-prerequisites-${{ matrix.arch }}-*-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/macos-evidence
    - name: Read this attempt's job timing evidence
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_REVISION: ${{ matrix.source }}
      run: |
        gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100' --jq '.jobs' > "$RUNNER_TEMP/mac-job-timings.json" || {
          rm -f "$RUNNER_TEMP/mac-job-timings.json"
          echo 'Job timing API unavailable; qualification still requires complete test evidence.'
        }
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: intel-inputs-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/macos-host-artifacts
    - name: Require complete exact-revision proof and summarize coverage
      if: always()
      env:
        EXPECTED_ARCH: ${{ matrix.arch }}
        EXPECTED_SHA: ${{ matrix.source }}
        SHARD_COUNT: ${{ matrix.count }}
        SOURCE_REVISION: ${{ matrix.source }}
      run: |
        set -eu
        # The artifact download admits only this workflow run and current attempt.
        # Normalize its directory names for the existing complete JUnit reconciler.
        python3 - <<'PY'
        import os
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"]) / "macos-evidence"
        arch, sha, run, attempt = (os.environ[key] for key in ("EXPECTED_ARCH", "EXPECTED_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
        for shard in range(int(os.environ["SHARD_COUNT"])):
            original = root / f"macos-prerequisites-{arch}-{shard}-{sha}-r{run}-a{attempt}"
            normalized = root / f"macos-prerequisites-{arch}-{shard}-{sha}"
            if not original.is_dir() or original.is_symlink() or normalized.exists():
                raise ValueError("missing or stale current-attempt Mac shard evidence")
            original.rename(normalized)
        PY
        node --input-type=module - <<'JS'
        import { readFile } from "node:fs/promises"
        import { join } from "node:path"
        import { candidateBinding, verifyCandidateBundle } from "./scripts/ci/candidate-provenance.mjs"
        const root = process.env.RUNNER_TEMP
        const bundle = join(root, "macos-host-artifacts")
        const receipt = await verifyCandidateBundle(bundle, { sourceRevision: process.env.EXPECTED_SHA })
        candidateBinding(receipt, JSON.parse(await readFile(join(bundle, "ARTIFACT.json"), "utf8")))
        for (let shard = 0; shard < Number(process.env.SHARD_COUNT); shard++) {
          const directory = join(root, "macos-evidence", `macos-prerequisites-${process.env.EXPECTED_ARCH}-${shard}-${process.env.EXPECTED_SHA}`)
          for (const filename of ["CANDIDATE.json", "ARTIFACT.json"]) {
            if (!(await readFile(join(directory, filename))).equals(await readFile(join(bundle, filename)))) throw Error("Mac shard used a different canonical candidate")
          }
        }
        JS
        python3 scripts/ci/macos-host-summary.py "$EXPECTED_ARCH" "$EXPECTED_SHA" "$SHARD_COUNT" \
          "$RUNNER_TEMP/macos-evidence" "$RUNNER_TEMP/mac-job-timings.json" \
          "$RUNNER_TEMP/mac-summary.json" >> "$GITHUB_STEP_SUMMARY"
    - name: Retain coverage and timing summary
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-summary-${{ matrix.arch }}-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/mac-summary.json
        if-no-files-found: ignore
        retention-days: 7
    - name: Bind complete native qualification to the canonical candidate
      env:
        ARCHITECTURE: ${{ matrix.arch }}
        SOURCE_REVISION: ${{ matrix.source }}
        EXPECTED_SHA: ${{ matrix.source }}
      run: |
        set -eu
        mkdir "$RUNNER_TEMP/macos-qualification"
        GITHUB_SHA="$EXPECTED_SHA" node scripts/ci/job-evidence.mjs --id "macos-$ARCHITECTURE" --summary "$RUNNER_TEMP/mac-summary.json" --artifacts --residue --output "$RUNNER_TEMP/macos-observed.json"
        node scripts/ci/candidate-provenance.mjs qualification "$RUNNER_TEMP/macos-host-artifacts" "$RUNNER_TEMP/macos-qualification/QUALIFICATION.json" --kind macos --profile "$ARCHITECTURE"
        cp "$RUNNER_TEMP/mac-summary.json" "$RUNNER_TEMP/macos-qualification/mac-summary.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-qualification-${{ matrix.arch }}-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/macos-qualification
        retention-days: 7
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-observed-${{ matrix.arch }}-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/macos-observed.json
        retention-days: 7
        if-no-files-found: error
    - name: Record exact Intel health result
      env:
        INTEL_TARGET: ${{ toJSON(matrix) }}
      run: node ../policy/scripts/ci/intel-nightly.mjs record "$RUNNER_TEMP/macos-qualification/QUALIFICATION.json" "$RUNNER_TEMP/intel-health.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: intel-health-${{ matrix.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/intel-health.json
        retention-days: 90
        if-no-files-found: error
    defaults:
      run:
        working-directory: candidate
  health:
    name: Intel compatibility health
    if: ${{ always() }}
    needs:
    - select
    - host-artifacts
    - prerequisites
    - qualified-architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      continue-on-error: true
      with:
        pattern: intel-health-*
        path: ${{ runner.temp }}/intel-health
    - name: Report current and last passing published Intel version
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        INTEL_TARGETS: ${{ needs.select.outputs.targets }}
      run: node scripts/ci/intel-nightly.mjs health "$RUNNER_TEMP/intel-health"
