name: Native Agent PR preflight
run-name: "Native diagnostic for reviewed PR #${{ inputs.pull_request }}"
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact reviewed PR merge commit, matching its canonical candidate
        required: true
        type: string
      pull_request:
        description: Open reviewed same-repository PR number
        required: true
        type: string
      producer_run_id:
        description: Canonical CI run for that exact PR source
        required: true
        type: string
permissions:
  contents: read
env:
  PREFLIGHT_SOURCE: ${{ inputs.source_revision }}
  PREFLIGHT_PULL_REQUEST: ${{ inputs.pull_request }}
  PREFLIGHT_PRODUCER_RUN: ${{ inputs.producer_run_id }}
jobs:
  select:
    name: Verify the explicitly reviewed PR source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      source_revision: ${{ steps.select.outputs.source_revision }}
      producer_run_attempt: ${{ steps.select.outputs.producer_run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/native-preflight.mjs select
  diagnostic:
    name: ${{ matrix.client }} — reviewed PR diagnostic
    needs: select
    if: needs.select.outputs.source_revision != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: native-agent-api
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - client: codex
            model: openrouter/free
            test-file: packages/jig/test/live/root-agent-codex-responses.test.ts
          - client: claude
            model: mistralai/ministral-8b-2512
            test-file: packages/jig/test/live/root-agent-claude.test.ts
    steps:
      - name: Load trusted preflight tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Acquire the exact reviewed canonical CI archives
        id: host-run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: node scripts/ci/native-preflight.mjs acquire "$RUNNER_TEMP/linux-host-artifacts"
        working-directory: trusted
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - name: Install exact Bun test tool
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Retain exact Bun executable
        env:
          JIG_CI_BUN: ${{ steps.setup-bun.outputs.bun-path }}
        run: printf 'JIG_CI_BUN=%s\n' "$JIG_CI_BUN" >> "$GITHUB_ENV"
      - name: Identify and verify the frozen archives
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/linux-host-artifacts"
          node scripts/ci/candidate-provenance.mjs verify "$artifact_directory" --source "$SOURCE_REVISION"
          (
            cd "$artifact_directory"
            sha256sum --check SHA256SUMS
          )
          one_archive() {
            local -a archives
            mapfile -t archives < <(find "$1" -maxdepth 1 -type f -name '*.tgz' -print)
            if [[ ${#archives[@]} -ne 1 ]]; then
              echo "expected exactly one archive in $1" >&2
              return 1
            fi
            readlink -f "${archives[0]}"
          }
          {
            printf 'REPORTING_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/reporting")"
            printf 'FLOW_SDK_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/flow-sdk")"
            printf 'AGENT_METHOD_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/agent-method")"
            printf 'AGENT_ACP_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/agent-acp")"
            printf 'DISPLAY_MODEL_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/display-model")"
            printf 'DISPLAY_WEB_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/display-web")"
            printf 'DISPLAY_TUI_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/display-tui")"
            printf 'JIG_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/jig")"
            printf 'JIG_CI_ARCHIVE_DIRECTORY=%s\n' "$artifact_directory"
          } >> "$GITHUB_ENV"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - name: Provision the disposable rootless host
        id: host
        run: |
          scripts/ci/provision-github-rootless-host.sh provision
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - name: Install source-test dependencies
        run: bun install --ignore-scripts --filter @jigging/jig --filter @jigging/agent-method --filter
          @jigging/agent-acp --filter @jigging/reporting --filter @jigging/display-model --filter
          @jigging/display-web --filter @jigging/display-tui
      - name: Build source-test workspace packages
        run: just --justfile packages/jig/justfile build
      - name: Install current native Codex
        if: matrix.client == 'codex'
        shell: bash
        run: >
          set -euo pipefail

          install_root="$RUNNER_TEMP/native-codex"

          mkdir -p "$install_root"

          npm install --prefix "$install_root" --ignore-scripts --no-audit --no-fund '@openai/codex@latest'

          codex_version=$(node -p "require('$install_root/node_modules/@openai/codex/package.json').version")

          mapfile -t paths < <(find "$install_root/node_modules" -type f -path
          '*/vendor/x86_64-unknown-linux-musl/bin/codex' -print)

          if [[ ${#paths[@]} -ne 1 || ! -x "${paths[0]}" ]]; then
            echo "expected one native x86-64 Codex executable from @latest" >&2
            exit 1
          fi

          agent_path=$(realpath "${paths[0]}")

          identity=$("$agent_path" --version)

          if [[ "$identity" != "codex-cli $codex_version" ]]; then
            echo "Codex package and native executable versions differ: $codex_version / $identity" >&2
            exit 1
          fi

          printf 'NATIVE_AGENT_PATH=%s\nNATIVE_AGENT_VERSION=%s\n' "$agent_path" "$identity" >> "$GITHUB_ENV"

          printf 'Installed Codex from @latest: `%s`\n' "$identity" >> "$GITHUB_STEP_SUMMARY"
      - name: Install current native Claude Code
        if: matrix.client == 'claude'
        shell: bash
        run: >
          set -euo pipefail

          install_root="$RUNNER_TEMP/native-claude-code"

          mkdir -p "$install_root"

          npm install --prefix "$install_root" --ignore-scripts --no-audit --no-fund
          '@anthropic-ai/claude-code@latest'

          claude_version=$(node -p
          "require('$install_root/node_modules/@anthropic-ai/claude-code/package.json').version")

          mapfile -t paths < <(find "$install_root/node_modules/@anthropic-ai" -type f -path
          '*/claude-code-linux-x64/claude' -print)

          if [[ ${#paths[@]} -ne 1 || ! -x "${paths[0]}" ]]; then
            echo "expected one native x86-64 Claude Code executable from @latest" >&2
            exit 1
          fi

          agent_path=$(realpath "${paths[0]}")

          identity=$("$agent_path" --version)

          if [[ "$identity" != *"$claude_version"* ]]; then
            echo "Claude Code package and native executable versions differ: $claude_version / $identity" >&2
            exit 1
          fi

          printf 'NATIVE_AGENT_PATH=%s\nNATIVE_AGENT_VERSION=%s\n' "$agent_path" "$identity" >> "$GITHUB_ENV"

          printf 'Installed Claude Code from @latest: `%s`\n' "$identity" >> "$GITHUB_STEP_SUMMARY"
      - name: Recheck current PR approval before the credential-bearing step
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/native-preflight.mjs verify
      - name: Qualify native ${{ matrix.client }} API-key ACP through OpenRouter
        id: native-api
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIG_NATIVE_API_CLIENT: ${{ matrix.client }}
          JIG_NATIVE_API_MODEL: ${{ matrix.model }}
          JIG_NATIVE_API_TEST_FILE: ${{ matrix.test-file }}
        run: >
          set -euo pipefail

          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "Configure OPENROUTER_API_KEY in the protected native-agent-api environment." >&2
            exit 1
          fi

          test_arguments=()

          case "$JIG_NATIVE_API_CLIENT" in
            codex)
              test_arguments=(--bail=1)
              client_environment=(
                "JIG_CODEX_PROOF_PATH=$NATIVE_AGENT_PATH"
                "JIG_CODEX_RESPONSES_MODEL=$JIG_NATIVE_API_MODEL"
              )
              ;;
            claude)
              client_environment=(
                "JIG_CLAUDE_PROOF_PATH=$NATIVE_AGENT_PATH"
                "JIG_CLAUDE_ANTHROPIC_MODEL=$JIG_NATIVE_API_MODEL"
              )
              ;;
            *)
              echo "unsupported native client: $JIG_NATIVE_API_CLIENT" >&2
              exit 2
              ;;
          esac

          set +e

          scripts/ci/provision-github-rootless-host.sh run-delegated \
            env JIG_LINUX_ROOTLESS_HOSTILE=1 \
            "AGENT_METHOD_PACKAGE_ARCHIVE=$AGENT_METHOD_PACKAGE_ARCHIVE" \
            "AGENT_ACP_PACKAGE_ARCHIVE=$AGENT_ACP_PACKAGE_ARCHIVE" \
            "FLOW_SDK_PACKAGE_ARCHIVE=$FLOW_SDK_PACKAGE_ARCHIVE" \
            "REPORTING_PACKAGE_ARCHIVE=$REPORTING_PACKAGE_ARCHIVE" \
            "DISPLAY_MODEL_PACKAGE_ARCHIVE=$DISPLAY_MODEL_PACKAGE_ARCHIVE" \
            "DISPLAY_WEB_PACKAGE_ARCHIVE=$DISPLAY_WEB_PACKAGE_ARCHIVE" \
            "DISPLAY_TUI_PACKAGE_ARCHIVE=$DISPLAY_TUI_PACKAGE_ARCHIVE" \
            "JIG_PACKAGE_ARCHIVE=$JIG_PACKAGE_ARCHIVE" \
            "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
            "JIG_NATIVE_API_MODEL=$JIG_NATIVE_API_MODEL" \
            "JIG_NATIVE_API_CLIENT=$JIG_NATIVE_API_CLIENT" \
            "${client_environment[@]}" \
            "$JIG_CI_BUN" test "$JIG_NATIVE_API_TEST_FILE" \
            --timeout 420000 "${test_arguments[@]}" 2>&1 | tee "$RUNNER_TEMP/native-api-tests.txt"
          qualification_status=("${PIPESTATUS[@]}")

          set -e

          if (( qualification_status[0] != 0 )); then
            if [[ "$JIG_NATIVE_API_CLIENT" == codex ]]; then
              timeout --kill-after=2s 30s node scripts/ci/native-responses-probe.mjs || true
            fi
            exit "${qualification_status[0]}"
          fi

          if (( qualification_status[1] != 0 )); then
            exit "${qualification_status[1]}"
          fi

          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {parseBunTranscript} from
          "./scripts/ci/test-reports.mjs"; parseBunTranscript(readFileSync(process.env.RUNNER_TEMP +
          "/native-api-tests.txt", "utf8"), {files: [process.env.JIG_NATIVE_API_TEST_FILE]});'
      - name: Verify the tested archives are unchanged
        if: always() && steps.archives.outputs.ready == 'true'
        run: >
          node scripts/ci/candidate-provenance.mjs verify "$JIG_CI_ARCHIVE_DIRECTORY" --source
          "$SOURCE_REVISION"

          cd "$JIG_CI_ARCHIVE_DIRECTORY" && sha256sum --check SHA256SUMS
      - name: Require zero host residue
        if: always() && steps.host.outputs.ready == 'true'
        run: scripts/ci/provision-github-rootless-host.sh assert-clean
      - name: Report diagnostic scope
        if: always()
        run: "printf '%s\\n' '## Native PR diagnostic: ${{ job.status }}' '' 'These results do not qualify a release.
          Main still requires complete same-candidate qualification.' >> \"$GITHUB_STEP_SUMMARY\""
    env:
      SOURCE_REVISION: ${{ needs.select.outputs.source_revision }}
      PREFLIGHT_PRODUCER_ATTEMPT: ${{ needs.select.outputs.producer_run_attempt }}
    defaults:
      run:
        working-directory: trusted
