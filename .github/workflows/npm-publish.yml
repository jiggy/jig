name: Publish npm prerelease

run-name: Publish npm ${{ inputs.version }} with ${{ inputs.dist_tag }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact prerelease version already present in both package manifests
        required: true
        type: string
      dist_tag:
        description: npm prerelease dist-tag
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-prerelease-publish
  cancel-in-progress: false

jobs:
  publish:
    environment: npm-alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Validate selected release
        run: |
          set -eu
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const selected = process.env.RELEASE_VERSION ?? "";
          const tag = process.env.RELEASE_TAG ?? "";
          const prerelease = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*$/;
          if (!prerelease.test(selected)) {
            throw new Error(`version must be one exact prerelease version, received ${JSON.stringify(selected)}`);
          }
          if (tag !== "alpha" && tag !== "next") {
            throw new Error(`dist-tag must be alpha or next, received ${JSON.stringify(tag)}`);
          }
          if (process.env.GITHUB_REF !== "refs/heads/main") {
            throw new Error("npm prereleases must be dispatched from the main branch");
          }

          const expected = new Map([
            ["packages/flow-sdk/package.json", "@jigging/flow"],
            ["packages/jig/package.json", "@jigging/jig"],
          ]);
          for (const [path, name] of expected) {
            const manifest = JSON.parse(await readFile(path, "utf8"));
            if (manifest.name !== name) {
              throw new Error(`${path} must name ${name}`);
            }
            if (manifest.version !== selected) {
              throw new Error(`${name} is ${manifest.version}; the selected version is ${selected}`);
            }
            if (manifest.private === true) {
              throw new Error(`${name} is still private; remove its private guard in the reviewed release commit before publishing`);
            }
            if (manifest.publishConfig?.access !== "public") {
              throw new Error(`${name} must publish with public access`);
            }
          }
          NODE

      - name: Install exact release tools
        run: |
          set -eu
          npm install --global npm@11.6.2
          npm install --global bun@1.3.3
          npm --version
          bun --version
          bun --revision

      - name: Refuse an existing version
        run: |
          set -eu
          assert_absent() {
            package=$1
            error_file="$RUNNER_TEMP/npm-view-error"
            if npm view "$package@$RELEASE_VERSION" version --json > /dev/null 2> "$error_file"; then
              echo "$package@$RELEASE_VERSION already exists; npm versions are immutable" >&2
              exit 1
            fi
            if ! grep -F 'E404' "$error_file" > /dev/null; then
              echo "npm could not prove that $package@$RELEASE_VERSION is absent" >&2
              sed -n '1,20p' "$error_file" >&2
              exit 1
            fi
          }
          assert_absent @jigging/flow
          assert_absent @jigging/jig

      - name: Build each candidate once
        run: |
          set -eu
          FLOW_NODE=$(command -v node)
          FLOW_NPM=$(command -v npm)
          JIG_NPM=$FLOW_NPM
          export FLOW_NODE FLOW_NPM JIG_NPM
          scripts/build-flow-sdk-candidate.sh "$RUNNER_TEMP/candidates/flow"
          scripts/build-jig-candidate.sh "$RUNNER_TEMP/candidates/jig"

      - name: Verify exact candidate manifests and digests
        id: candidates
        run: |
          set -eu
          verify_candidate() {
            directory=$1
            expected_name=$2
            manifest=$3
            set -- "$directory"/*.tgz
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "$expected_name did not produce exactly one candidate archive" >&2
              exit 1
            fi
            archive=$1
            filename=$(basename -- "$archive")
            (cd "$directory" && sha256sum --check "$filename.sha256" > /dev/null)
            tar -xOzf "$archive" package/package.json > "$manifest"
            printf '%s\n' "$archive"
          }

          flow_manifest="$RUNNER_TEMP/flow-package.json"
          jig_manifest="$RUNNER_TEMP/jig-package.json"
          flow_archive=$(verify_candidate "$RUNNER_TEMP/candidates/flow" @jigging/flow "$flow_manifest")
          jig_archive=$(verify_candidate "$RUNNER_TEMP/candidates/jig" @jigging/jig "$jig_manifest")
          FLOW_ARCHIVE="$flow_archive" \
          FLOW_MANIFEST="$flow_manifest" \
          FLOW_SUCCESS="$RUNNER_TEMP/candidates/flow/SUCCESS.json" \
          JIG_ARCHIVE="$jig_archive" \
          JIG_MANIFEST="$jig_manifest" \
          JIG_SUCCESS="$RUNNER_TEMP/candidates/jig/SUCCESS.json" \
            node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import { basename } from "node:path";

          const candidates = [
            ["@jigging/flow", process.env.FLOW_ARCHIVE, process.env.FLOW_MANIFEST, process.env.FLOW_SUCCESS],
            ["@jigging/jig", process.env.JIG_ARCHIVE, process.env.JIG_MANIFEST, process.env.JIG_SUCCESS],
          ];
          for (const [name, archive, manifestPath, successPath] of candidates) {
            const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
            const success = JSON.parse(await readFile(successPath, "utf8"));
            const bytes = await readFile(archive);
            const digest = createHash("sha256").update(bytes).digest("hex");
            if (manifest.name !== name || manifest.version !== process.env.RELEASE_VERSION) {
              throw new Error(`candidate manifest mismatch for ${name}`);
            }
            if (manifest.private === true) {
              throw new Error(`${name} candidate is still private`);
            }
            if (success.archive !== basename(archive) || success.sha256 !== digest) {
              throw new Error(`${name} candidate evidence does not match its archive`);
            }
            if (success.commit !== process.env.GITHUB_SHA) {
              throw new Error(`${name} candidate was not built from this workflow commit`);
            }
          }
          NODE
          printf 'flow_archive=%s\n' "$flow_archive" >> "$GITHUB_OUTPUT"
          printf 'jig_archive=%s\n' "$jig_archive" >> "$GITHUB_OUTPUT"

      - name: Publish exact candidates with npm trusted publishing
        env:
          FLOW_ARCHIVE: ${{ steps.candidates.outputs.flow_archive }}
          JIG_ARCHIVE: ${{ steps.candidates.outputs.jig_archive }}
        run: |
          set -eu
          npm publish "$FLOW_ARCHIVE" --access public --tag "$RELEASE_TAG" --provenance --ignore-scripts
          npm publish "$JIG_ARCHIVE" --access public --tag "$RELEASE_TAG" --provenance --ignore-scripts

      - name: Refetch and compare published archives
        env:
          FLOW_ARCHIVE: ${{ steps.candidates.outputs.flow_archive }}
          JIG_ARCHIVE: ${{ steps.candidates.outputs.jig_archive }}
        run: |
          set -eu
          compare_registry_archive() {
            package=$1
            candidate=$2
            destination="$RUNNER_TEMP/refetched/$(printf '%s' "$package" | tr '/@' '__')"
            mkdir -p "$destination"
            npm pack "$package@$RELEASE_VERSION" --pack-destination "$destination" --ignore-scripts > /dev/null
            set -- "$destination"/*.tgz
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "npm did not refetch exactly one archive for $package@$RELEASE_VERSION" >&2
              exit 1
            fi
            candidate_digest=$(sha256sum "$candidate")
            candidate_digest=${candidate_digest%% *}
            registry_digest=$(sha256sum "$1")
            registry_digest=${registry_digest%% *}
            if [ "$candidate_digest" != "$registry_digest" ]; then
              echo "registry bytes differ from the proved $package candidate" >&2
              exit 1
            fi
            tagged=$(npm view "$package" "dist-tags.$RELEASE_TAG" --json)
            expected=$(RELEASE_VERSION="$RELEASE_VERSION" node -p 'JSON.stringify(process.env.RELEASE_VERSION)')
            if [ "$tagged" != "$expected" ]; then
              echo "$package@$RELEASE_VERSION did not receive the $RELEASE_TAG dist-tag" >&2
              exit 1
            fi
          }
          compare_registry_archive @jigging/flow "$FLOW_ARCHIVE"
          compare_registry_archive @jigging/jig "$JIG_ARCHIVE"
