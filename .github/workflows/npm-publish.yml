name: Publish npm prereleases

run-name: Reconcile qualified npm prereleases

on:
  workflow_run:
    workflows: [CI, Linux host conformance, macOS hosted candidates, Native Agent API qualification]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact main-push source revision to reconcile
        required: true
        type: string

jobs:
  authorize:
    name: Require same-revision release qualification
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      source_revision: ${{ steps.ready.outputs.source_revision }}
      producer_run_id: ${{ steps.ready.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.ready.outputs.producer_run_attempt }}
      ready_flow: ${{ steps.ready.outputs.ready_flow }}
      ready_host: ${{ steps.ready.outputs.ready_host }}
      candidate_artifact_id: ${{ steps.ready.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.ready.outputs.candidate_artifact_digest }}
      candidate_receipt_sha256: ${{ steps.ready.outputs.candidate_receipt_sha256 }}
      flow_snapshot: ${{ steps.ready.outputs.flow_snapshot }}
      host_snapshot: ${{ steps.ready.outputs.host_snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify current-attempt source and candidate readiness
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE: ${{ inputs.source_revision }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node scripts/ci/release-readiness.mjs --source "$REQUESTED_SOURCE" --github-output "$GITHUB_OUTPUT"
          else
            node scripts/ci/release-readiness.mjs --github-output "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish independent FLOW SDK candidate
    needs: authorize
    if: needs.authorize.outputs.ready_flow == 'true'
    concurrency:
      group: npm-prerelease-flow
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_GROUP: flow
      SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
      EXPECTED_RECEIPT_SHA256: ${{ needs.authorize.outputs.candidate_receipt_sha256 }}
      QUALIFICATION_SNAPSHOT: ${{ needs.authorize.outputs.flow_snapshot }}
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      id-token: write
    outputs: &release_outputs
      flow_new: ${{ steps.release.outputs.flow_new }}
      flow_state: ${{ steps.release.outputs.flow_state }}
      flow_version: ${{ steps.release.outputs.flow_version }}
      jig_new: ${{ steps.release.outputs.jig_new }}
      jig_state: ${{ steps.release.outputs.jig_state }}
      jig_version: ${{ steps.release.outputs.jig_version }}
      agent_new: ${{ steps.release.outputs.agent_new }}
      agent_state: ${{ steps.release.outputs.agent_state }}
      agent_version: ${{ steps.release.outputs.agent_version }}
      acp_new: ${{ steps.release.outputs.acp_new }}
      acp_state: ${{ steps.release.outputs.acp_state }}
      acp_version: ${{ steps.release.outputs.acp_version }}
    steps: &publish_steps
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Require trusted-publishing npm
        run: |
          set -eu
          npm_version=$(npm --version)
          NPM_VERSION=$npm_version node --input-type=module <<'NODE'
          const parsed = (process.env.NPM_VERSION ?? "").split(".").map(Number);
          if (parsed.length < 3 || parsed.some((part) => !Number.isInteger(part)) ||
              parsed[0] < 11 || (parsed[0] === 11 && parsed[1] < 5) ||
              (parsed[0] === 11 && parsed[1] === 5 && parsed[2] < 1)) {
            throw new Error(`npm >=11.5.1 is required for trusted publishing; found ${process.env.NPM_VERSION}`);
          }
          NODE
          printf 'npm %s\n' "$npm_version"

      - name: Download exact persisted candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.authorize.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.producer_run_id }}

      - name: Publish or converge qualified package group
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          # The protected workflow owns this verifier. Queued jobs cannot rely
          # on a readiness snapshot taken before approval or the mutation lock.
          revalidate_qualification() {
            node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const snapshot = JSON.parse(process.env.QUALIFICATION_SNAPSHOT ?? 'null');
          const repository = process.env.GITHUB_REPOSITORY;
          if (snapshot?.schemaVersion !== 1 || snapshot.repository !== repository ||
              snapshot.group !== process.env.RELEASE_GROUP || snapshot.sourceRevision !== process.env.SOURCE_REVISION ||
              snapshot.candidate?.receiptSha256 !== process.env.EXPECTED_RECEIPT_SHA256 ||
              !Array.isArray(snapshot.runs) || snapshot.runs.length !== (snapshot.group === 'flow' ? 1 : 4) ||
              !Array.isArray(snapshot.artifacts) || snapshot.artifacts.length !== (snapshot.group === 'flow' ? 1 : 7))
            throw new Error('Invalid authorized qualification snapshot');
          const api = (path) => JSON.parse(execFileSync('gh', ['api', path], {
            encoding: 'utf8', timeout: 60_000, maxBuffer: 16 * 1024 * 1024,
          }));
          const list = (path, key) => {
            const values = [];
            for (let page = 1; page <= 10; page++) {
              const result = api(`${path}${path.includes('?') ? '&' : '?'}per_page=100&page=${page}`);
              if (!Array.isArray(result[key])) throw new Error('Malformed GitHub evidence response');
              values.push(...result[key]);
              if (result[key].length < 100) return values;
            }
            throw new Error('GitHub evidence pagination exceeded its bound');
          };
          for (const expected of snapshot.runs) {
            const current = api(`repos/${repository}/actions/runs/${expected.runId}`);
            if (current.id !== expected.runId || current.run_attempt !== expected.runAttempt ||
                current.status !== 'completed' || current.conclusion !== 'success' ||
                current.repository?.full_name !== repository || current.path !== expected.workflowPath ||
                current.event !== expected.event || current.head_sha !== expected.headSha ||
                current.head_branch !== expected.headBranch || current.head_repository?.full_name !== expected.headRepository)
              throw new Error('Qualification run changed after authorization');
            const jobs = list(`repos/${repository}/actions/runs/${expected.runId}/attempts/${expected.runAttempt}/jobs`, 'jobs');
            if (!Array.isArray(expected.jobs) || expected.jobs.length === 0) throw new Error('Missing qualification job obligations');
            for (const proof of expected.jobs) {
              const matching = jobs.filter((job) => job.name === proof.name);
              if (proof.runId !== expected.runId || proof.runAttempt !== expected.runAttempt || matching.length !== 1 ||
                  matching[0].id !== proof.jobId || matching[0].status !== 'completed' || matching[0].conclusion !== 'success' ||
                  (matching[0].run_attempt !== undefined && matching[0].run_attempt !== expected.runAttempt))
                throw new Error('Qualification job changed after authorization');
            }
            if (expected.event === 'push') {
              const query = new URLSearchParams({ branch: 'main', event: 'push', head_sha: snapshot.sourceRevision });
              const runs = list(`repos/${repository}/actions/workflows/${expected.workflowPath.split('/').at(-1)}/runs?${query}`, 'workflow_runs');
              const latest = runs.filter((run) => run.path === expected.workflowPath && run.event === 'push' &&
                run.head_sha === snapshot.sourceRevision && run.head_branch === 'main' &&
                run.repository?.full_name === repository && run.head_repository?.full_name === repository)
                .sort((a, b) => b.id - a.id)[0];
              if (latest?.id !== expected.runId || latest.run_attempt !== expected.runAttempt)
                throw new Error('A newer source qualification superseded authorization');
            } else {
              const runs = list(`repos/${repository}/actions/workflows/native-agent-api-qualification.yml/runs`, 'workflow_runs');
              for (const run of runs) {
                if (run.id <= expected.runId || run.path !== expected.workflowPath || run.head_branch !== 'main' ||
                    run.repository?.full_name !== repository || run.head_repository?.full_name !== repository ||
                    !['workflow_run', 'workflow_dispatch'].includes(run.event)) continue;
                if (run.event === 'workflow_dispatch' && run.head_sha === snapshot.sourceRevision)
                  throw new Error('A newer manual native qualification superseded authorization');
                const artifacts = list(`repos/${repository}/actions/runs/${run.id}/artifacts`, 'artifacts');
                const name = new RegExp(`^native-(inputs|qualification)-(codex|claude|pi)-${snapshot.sourceRevision}-r${run.id}-a[1-9][0-9]*$`);
                if (artifacts.some((artifact) => name.test(artifact.name ?? '')))
                  throw new Error('A newer native qualification superseded authorization');
              }
            }
          }
          for (const expected of snapshot.artifacts) {
            const current = api(`repos/${repository}/actions/artifacts/${expected.artifactId}`);
            if (current.id !== expected.artifactId || current.name !== expected.name || current.digest !== expected.digest ||
                current.expired !== false || !Number.isFinite(Date.parse(current.expires_at)) || Date.parse(current.expires_at) <= Date.now() ||
                current.workflow_run?.id !== expected.runId || current.workflow_run?.head_sha !== expected.headSha)
              throw new Error('Qualification artifact changed or expired after authorization');
          }
          NODE
          }

          # Inspect data only; this protected job never checks out or runs source.
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const bytes = await readFile(`${process.env.RUNNER_TEMP}/candidates/CANDIDATE.json`);
          if (createHash('sha256').update(bytes).digest('hex') !== process.env.EXPECTED_RECEIPT_SHA256)
            throw new Error('candidate receipt differs from authorized artifact');
          const receipt = JSON.parse(bytes);
          if (receipt.schemaVersion !== 1 || receipt.sourceRevision !== process.env.SOURCE_REVISION)
            throw new Error('candidate receipt source mismatch');
          NODE

          archive_digest() {
            node --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readFile } from "node:fs/promises";
              console.log(createHash("sha256").update(await readFile(process.argv[1])).digest("hex"));
            ' "$1"
          }

          compare_versions() {
            CANDIDATE_VERSION=$1 CHANNEL_VERSION=$2 node --input-type=module -e '
              const parse = (value) => {
                const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(value);
                if (!match) throw new Error(`invalid registry version: ${value}`);
                const pre = match[4]?.split(".") ?? [];
                if (pre.some((part) => /^\d+$/.test(part) && part.length > 1 && part[0] === "0"))
                  throw new Error(`invalid numeric prerelease identifier: ${value}`);
                return { core: match.slice(1, 4).map(BigInt), pre };
              };
              const candidate = parse(process.env.CANDIDATE_VERSION);
              const channel = process.env.CHANNEL_VERSION ? parse(process.env.CHANNEL_VERSION) : null;
              if (channel === null) { console.log("newer"); process.exit(0); }
              const compare = (a, b) => a < b ? -1 : a > b ? 1 : 0;
              let order = 0;
              for (let index = 0; index < 3 && order === 0; index++)
                order = compare(candidate.core[index], channel.core[index]);
              if (order === 0) {
                if (candidate.pre.length === 0 || channel.pre.length === 0)
                  order = compare(candidate.pre.length === 0, channel.pre.length === 0);
                else for (let index = 0; index < Math.max(candidate.pre.length, channel.pre.length) && order === 0; index++) {
                  const a = candidate.pre[index], b = channel.pre[index];
                  if (a === undefined || b === undefined) order = compare(a !== undefined, b !== undefined);
                  else {
                    const an = /^\d+$/.test(a), bn = /^\d+$/.test(b);
                    order = an !== bn ? (an ? -1 : 1) : an ? compare(BigInt(a), BigInt(b)) : compare(a, b);
                  }
                }
              }
              console.log(order < 0 ? "older" : order > 0 ? "newer" : "equal");
            '
          }

          publish_candidate() {
            package_kind=$1
            package_name=$2
            visibility_attempts=100
            visibility_delay_seconds=10
            case "$package_kind" in
              flow) archive_kind=flow-sdk ;;
              agent) archive_kind=agent-method ;;
              acp) archive_kind=agent-acp ;;
              jig) archive_kind=jig ;;
              *) echo 'unknown package kind' >&2; exit 1 ;;
            esac
            set -- "$RUNNER_TEMP"/candidates/"$archive_kind"/*.tgz
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "$package_name did not persist exactly one candidate archive" >&2
              exit 1
            fi
            archive=$1
            candidate_directory=$(dirname -- "$archive")
            manifest="$RUNNER_TEMP/$package_kind-package.json"
            tar -xOzf "$archive" package/package.json > "$manifest"

            metadata=$(\
              CANDIDATE_ARCHIVE=$archive \
              CANDIDATE_MANIFEST=$manifest \
              CANDIDATE_SUCCESS="$candidate_directory/SUCCESS.json" \
              CANDIDATE_KIND=$archive_kind \
              EXPECTED_NAME=$package_name \
              node --input-type=module -e '
                import { createHash } from "node:crypto";
                import { readFile } from "node:fs/promises";
                import { basename, relative } from "node:path";
                const archive = process.env.CANDIDATE_ARCHIVE;
                const manifest = JSON.parse(await readFile(process.env.CANDIDATE_MANIFEST, "utf8"));
                const success = JSON.parse(await readFile(process.env.CANDIDATE_SUCCESS, "utf8"));
                const digest = createHash("sha256").update(await readFile(archive)).digest("hex");
                const receipt = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/candidates/CANDIDATE.json`, "utf8"));
                const entries = receipt.packages.filter((item) => item.kind === process.env.CANDIDATE_KIND);
                if (entries.length !== 1 || entries[0].name !== manifest.name || entries[0].version !== manifest.version ||
                    entries[0].archive !== relative(`${process.env.RUNNER_TEMP}/candidates`, archive) || entries[0].sha256 !== digest)
                  throw new Error("candidate archive differs from authorized receipt");
                const sidecar = await readFile(`${archive}.sha256`, "utf8");
                if (sidecar !== `${digest}  ${basename(archive)}\n`) throw new Error("candidate digest sidecar does not match its archive");
                const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|next)(?:\.[0-9A-Za-z-]+)*$/.exec(manifest.version);
                if (manifest.name !== process.env.EXPECTED_NAME || match === null) throw new Error(`candidate manifest mismatch for ${process.env.EXPECTED_NAME}`);
                if (manifest.private === true || manifest.publishConfig?.access !== "public") throw new Error(`${manifest.name} candidate is not public`);
                if (success.archive !== basename(archive) || success.sha256 !== digest) throw new Error(`${manifest.name} candidate evidence does not match its archive`);
                if (success.commit !== process.env.SOURCE_REVISION) throw new Error(`${manifest.name} candidate was not built from the successful CI revision`);
                process.stdout.write(`${manifest.version}\n${match[4]}\n`);
              '
            )
            version=$(printf '%s\n' "$metadata" | sed -n '1p')
            release_tag=$(printf '%s\n' "$metadata" | sed -n '2p')

            presence_error="$RUNNER_TEMP/$package_kind-presence-error"
            new_release=false
            if npm view "$package_name@$version" version --json > /dev/null 2> "$presence_error"; then
              present=true
            elif grep -F 'E404' "$presence_error" > /dev/null; then
              present=false
            else
              echo "npm could not determine whether $package_name@$version exists" >&2
              sed -n '1,20p' "$presence_error" >&2
              exit 1
            fi

            tag_error="$RUNNER_TEMP/$package_kind-tag-error"
            if tagged_json=$(npm view "$package_name" "dist-tags.$release_tag" --json 2> "$tag_error"); then
              :
            elif grep -F 'E404' "$tag_error" > /dev/null; then
              tagged_json=
            else
              echo "npm could not read the $release_tag channel for $package_name" >&2
              sed -n '1,20p' "$tag_error" >&2
              exit 1
            fi
            tagged=$(TAGGED_JSON="$tagged_json" node --input-type=module -e '
              const value = process.env.TAGGED_JSON;
              if (!value || value === "null") process.exit(0);
              const parsed = JSON.parse(value);
              if (typeof parsed !== "string") throw new Error("invalid npm dist-tag response");
              process.stdout.write(parsed);
            ')
            relation=$(compare_versions "$version" "$tagged")
            if [ "$present" = true ]; then
              state=verified
            elif [ "$relation" = older ]; then
              state=superseded
            elif [ "$relation" = equal ]; then
              echo "$package_name@$version is tagged but its exact version is unavailable" >&2
              exit 1
            else
              state=published
            fi

            if [ "$state" = superseded ]; then
              echo "$package_name@$version is superseded by $release_tag@$tagged; no archive was published"
            elif [ "$state" = verified ] || [ "${PREFLIGHT:-false}" = false ]; then
              if [ "$state" = published ]; then
                new_release=true
                revalidate_qualification
                set +e
                npm publish "$archive" --access public --tag "$release_tag" --provenance --ignore-scripts
                publish_status=$?
                set -e
              else
                publish_status=0
              fi

              refetched_directory="$RUNNER_TEMP/refetched-$package_kind"
              mkdir -p "$refetched_directory"
              refetched=
              attempt=1
              while [ "$attempt" -le "$visibility_attempts" ]; do
                rm -f "$refetched_directory"/*.tgz
                if npm pack "$package_name@$version" \
                    --pack-destination "$refetched_directory" --ignore-scripts > /dev/null 2>&1; then
                  set -- "$refetched_directory"/*.tgz
                  if [ "$#" -eq 1 ] && [ -f "$1" ]; then
                    refetched=$1
                    break
                  fi
                fi
                if [ "$attempt" -lt "$visibility_attempts" ]; then
                  sleep "$visibility_delay_seconds"
                fi
                attempt=$((attempt + 1))
              done
              if [ -z "$refetched" ]; then
                echo "npm did not expose $package_name@$version before the visibility deadline (publish exit $publish_status)" >&2
                exit 1
              fi

              candidate_digest=$(archive_digest "$archive")
              registry_digest=$(archive_digest "$refetched")
              if [ "$candidate_digest" != "$registry_digest" ]; then
                echo "registry bytes differ from the persisted $package_name candidate; bump its version" >&2
                exit 1
              fi
            fi

            if [ "${PREFLIGHT:-false}" = true ]; then
              echo "$package_name@$version preflight: $state"
              return
            fi
            if [ "$state" = verified ] && [ -z "$tagged" ]; then
              echo "$package_name@$version matches registry bytes; the missing $release_tag tag cannot be changed through trusted-publisher OIDC" >&2
            elif [ "$state" = verified ] && [ "$relation" = older ]; then
              echo "$package_name@$version matches registry bytes; a newer $release_tag tag remains unchanged"
            elif [ "$state" = verified ] && [ "$relation" = newer ]; then
              echo "$package_name@$version matches registry bytes; the older $release_tag tag cannot be changed through trusted-publisher OIDC" >&2
            fi
            if [ "$state" = published ]; then
              attempt=1
              while [ "$attempt" -le "$visibility_attempts" ]; do
                observed=$(npm view "$package_name" "dist-tags.$release_tag" --json 2> /dev/null || true)
                observed=$(TAGGED_JSON="$observed" node --input-type=module -e '
                  const value = process.env.TAGGED_JSON;
                  if (value && value !== "null") process.stdout.write(JSON.parse(value));
                ')
                relation=$(compare_versions "$version" "$observed")
                if [ "$relation" != newer ]; then break; fi
                if [ "$attempt" -lt "$visibility_attempts" ]; then sleep "$visibility_delay_seconds"; fi
                attempt=$((attempt + 1))
              done
              if [ "$relation" = newer ]; then
                echo "$package_name@$version did not converge on the $release_tag dist-tag (publish exit $publish_status)" >&2
                exit 1
              fi
            fi
            printf '%s_new=%s\n' "$package_kind" "$new_release" >> "$GITHUB_OUTPUT"
            printf '%s_state=%s\n' "$package_kind" "$state" >> "$GITHUB_OUTPUT"
            printf '%s_version=%s\n' "$package_kind" "$version" >> "$GITHUB_OUTPUT"
          }

          # Keep the independent SDK outside Jig's host qualification path.
          # Each group preflights its complete set before any registry mutation.
          case "$RELEASE_GROUP" in
            flow) package_kinds=flow ;;
            host) package_kinds="agent acp jig" ;;
            *) echo "unknown release group" >&2; exit 1 ;;
          esac
          revalidate_qualification
          for PREFLIGHT in true false; do
            for kind in $package_kinds; do
              case "$kind" in
                flow) publish_candidate flow @jigging/flow ;;
                agent) publish_candidate agent @jigging/agent-method ;;
                acp) publish_candidate acp @jigging/agent-acp ;;
                jig) publish_candidate jig @jigging/jig ;;
              esac
            done
          done

  publish_host:
    name: Publish host-qualified Agent and Jig candidates
    needs: [authorize, publish]
    if: needs.authorize.outputs.ready_host == 'true'
    concurrency:
      group: npm-prerelease-host
      cancel-in-progress: false
      queue: max
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      id-token: write
    env:
      RELEASE_GROUP: host
      SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
      EXPECTED_RECEIPT_SHA256: ${{ needs.authorize.outputs.candidate_receipt_sha256 }}
      QUALIFICATION_SNAPSHOT: ${{ needs.authorize.outputs.host_snapshot }}
    outputs: *release_outputs
    steps: *publish_steps

  tag:
    name: Tag published source and create package releases
    needs: [authorize, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_GROUP: flow
      SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
      FLOW_NEW: ${{ needs.publish.outputs.flow_new }}
      FLOW_STATE: ${{ needs.publish.outputs.flow_state }}
      FLOW_VERSION: ${{ needs.publish.outputs.flow_version }}
      GH_TOKEN: ${{ github.token }}
      JIG_NEW: ${{ needs.publish.outputs.jig_new }}
      JIG_STATE: ${{ needs.publish.outputs.jig_state }}
      JIG_VERSION: ${{ needs.publish.outputs.jig_version }}
      AGENT_NEW: ${{ needs.publish.outputs.agent_new }}
      AGENT_STATE: ${{ needs.publish.outputs.agent_state }}
      AGENT_VERSION: ${{ needs.publish.outputs.agent_version }}
      ACP_NEW: ${{ needs.publish.outputs.acp_new }}
      ACP_STATE: ${{ needs.publish.outputs.acp_state }}
      ACP_VERSION: ${{ needs.publish.outputs.acp_version }}
    steps: &tag_steps
      - name: Create or verify annotated package tags
        run: |
          set -eu

          converge_tag() {
            tag=$1
            message=$2
            require_current=$3
            state=$4
            case "$state" in
              superseded) return ;;
              published|verified) ;;
              *) echo "missing or invalid qualified package state" >&2; exit 1 ;;
            esac
            verify_tag() {
              if ! ref_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.type 2> /dev/null); then
                return 1
              fi
              ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
              if [ "$ref_type" = tag ]; then
                target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq .object.sha)
              else
                target=$ref_sha
              fi
              if [ "$require_current" = true ] && [ "$target" != "$SOURCE_REVISION" ]; then
                echo "$tag already names a different source revision" >&2
                exit 1
              fi
              return 0
            }
            if verify_tag; then return; fi
            tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" -f message="$message" -f object="$SOURCE_REVISION" \
              -f type=commit --jq .sha)
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$tag_object" > /dev/null; then
              # Another completion event may have converged the same tag.
              verify_tag || return 1
            fi
          }

          case "$RELEASE_GROUP" in
            flow)
              converge_tag "flow-v$FLOW_VERSION" "@jigging/flow $FLOW_VERSION" "$FLOW_NEW" "$FLOW_STATE"
              ;;
            host)
              converge_tag "agent-method-v$AGENT_VERSION" "@jigging/agent-method $AGENT_VERSION" "$AGENT_NEW" "$AGENT_STATE"
              converge_tag "agent-acp-v$ACP_VERSION" "@jigging/agent-acp $ACP_VERSION" "$ACP_NEW" "$ACP_STATE"
              converge_tag "jig-v$JIG_VERSION" "@jigging/jig $JIG_VERSION" "$JIG_NEW" "$JIG_STATE"
              ;;
            *) exit 1 ;;
          esac

      - name: Link published packages from GitHub Releases
        run: |
          set -eu
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/existing-releases"

          create_release() {
            kind=$1
            version=$2
            description=$3
            install=$4
            documentation=$5
            state=$6
            case "$state" in
              superseded) return ;;
              published|verified) ;;
              *) echo "missing or invalid qualified package state" >&2; exit 1 ;;
            esac
            tag="$kind-v$version"
            if grep -Fx -- "$tag" "$RUNNER_TEMP/existing-releases" > /dev/null; then
              return
            fi
            notes="$RUNNER_TEMP/$kind-release.md"
            {
              printf '%s\n\n' "$description"
              printf '[View @jigging/%s %s on npm](https://www.npmjs.com/package/@jigging/%s/v/%s).\n\n' \
                "$kind" "$version" "$kind" "$version"
              printf 'Install this prerelease:\n\n```sh\n%s\n```\n\n' "$install"
              printf '[Documentation and prerequisites](%s).\n\n' "$documentation"
              printf 'Install the published npm package above. GitHub source archives contain the repository source.\n'
              if [ "$kind" = jig ]; then
                printf '\n[Download matching source](https://github.com/%s/archive/refs/tags/%s.tar.gz).\n\n' "$GITHUB_REPOSITORY" "$tag"
                printf '[Build instructions](https://github.com/%s/blob/%s/RELEASING.md#build-a-source-release).\n' "$GITHUB_REPOSITORY" "$tag"
              fi
            } > "$notes"
            if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --latest=false \
              --title "@jigging/$kind $version" --notes-file "$notes"; then
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json tagName,isPrerelease > "$RUNNER_TEMP/existing-release.json"
              EXPECTED_TAG=$tag node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
                if (release.tagName !== process.env.EXPECTED_TAG || release.isPrerelease !== true)
                  throw new Error("concurrent release has unexpected identity");
              ' "$RUNNER_TEMP/existing-release.json"
            fi
          }

          case "$RELEASE_GROUP" in
            flow)
              create_release flow "$FLOW_VERSION" 'TypeScript SDK for FLOW Run/0.' \
                "npm install @jigging/flow@$FLOW_VERSION" 'https://flow.jig.md/guide/' "$FLOW_STATE"
              ;;
            host)
              create_release agent-method "$AGENT_VERSION" 'Replaceable HTTP Agent Flow and reusable method library.' \
                "npm install @jigging/agent-method@$AGENT_VERSION" 'https://jig.md/guide/agent-method' "$AGENT_STATE"
              create_release agent-acp "$ACP_VERSION" 'Replaceable Agent Flow over a host-authorized finite ACP resource.' \
                "npm install @jigging/agent-acp@$ACP_VERSION" 'https://jig.md/guide/agents' "$ACP_STATE"
              create_release jig "$JIG_VERSION" 'Jig runs admitted FLOW packages under operator control.' \
                "npm install --global @jigging/jig@$JIG_VERSION" 'https://jig.md/guide/' "$JIG_STATE"
              ;;
            *) exit 1 ;;
          esac

  tag_host:
    name: Tag host-qualified packages and create releases
    needs: [authorize, publish_host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_GROUP: host
      SOURCE_REVISION: ${{ needs.authorize.outputs.source_revision }}
      FLOW_NEW: ${{ needs.publish_host.outputs.flow_new }}
      FLOW_STATE: ${{ needs.publish_host.outputs.flow_state }}
      FLOW_VERSION: ${{ needs.publish_host.outputs.flow_version }}
      GH_TOKEN: ${{ github.token }}
      JIG_NEW: ${{ needs.publish_host.outputs.jig_new }}
      JIG_STATE: ${{ needs.publish_host.outputs.jig_state }}
      JIG_VERSION: ${{ needs.publish_host.outputs.jig_version }}
      AGENT_NEW: ${{ needs.publish_host.outputs.agent_new }}
      AGENT_STATE: ${{ needs.publish_host.outputs.agent_state }}
      AGENT_VERSION: ${{ needs.publish_host.outputs.agent_version }}
      ACP_NEW: ${{ needs.publish_host.outputs.acp_new }}
      ACP_STATE: ${{ needs.publish_host.outputs.acp_state }}
      ACP_VERSION: ${{ needs.publish_host.outputs.acp_version }}
    steps: *tag_steps
