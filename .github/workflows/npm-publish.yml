name: Publish npm prerelease

run-name: Publish ${{ inputs.package }} ${{ inputs.version }} with ${{ inputs.dist_tag }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - flow
          - jig
      version:
        description: Exact prerelease version already present in the selected manifest
        required: true
        type: string
      dist_tag:
        description: npm prerelease dist-tag
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - next

concurrency:
  group: npm-prerelease-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      RELEASE_PACKAGE: ${{ inputs.package }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.dist_tag }}
    outputs:
      artifact_name: ${{ steps.selected.outputs.artifact_name }}
      package_name: ${{ steps.selected.outputs.package_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Select and validate exact package
        id: selected
        run: |
          set -eu
          case $RELEASE_PACKAGE in
            flow)
              package_name=@jigging/flow
              manifest=packages/flow-sdk/package.json
              ;;
            jig)
              package_name=@jigging/jig
              manifest=packages/jig/package.json
              ;;
            *)
              echo "package must be flow or jig" >&2
              exit 1
              ;;
          esac
          PACKAGE_MANIFEST=$manifest EXPECTED_NAME=$package_name \
            node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const selected = process.env.RELEASE_VERSION ?? "";
          const prerelease = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*$/;
          if (!prerelease.test(selected)) {
            throw new Error(`version must be one exact prerelease version, received ${JSON.stringify(selected)}`);
          }
          if (process.env.RELEASE_TAG !== "alpha" && process.env.RELEASE_TAG !== "next") {
            throw new Error("dist-tag must be alpha or next");
          }
          if (process.env.GITHUB_REF !== "refs/heads/main") {
            throw new Error("npm prereleases must be dispatched from the main branch");
          }
          const manifest = JSON.parse(await readFile(process.env.PACKAGE_MANIFEST, "utf8"));
          if (manifest.name !== process.env.EXPECTED_NAME || manifest.version !== selected) {
            throw new Error(`${process.env.PACKAGE_MANIFEST} does not declare ${process.env.EXPECTED_NAME}@${selected}`);
          }
          if (manifest.private === true) {
            throw new Error(`${manifest.name} is still private; remove its private guard in the reviewed release commit before publishing`);
          }
          if (manifest.publishConfig?.access !== "public") {
            throw new Error(`${manifest.name} must publish with public access`);
          }
          NODE
          artifact_name="npm-candidate-$RELEASE_PACKAGE-$RELEASE_VERSION-$GITHUB_SHA"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'package_name=%s\n' "$package_name" >> "$GITHUB_OUTPUT"

      - name: Install exact build tools
        run: |
          set -eu
          npm install --global npm@11.6.2
          npm install --global bun@1.3.3
          npm --version
          bun --version
          bun --revision

      - name: Provision Jig's disposable rootless host
        id: jig_host
        if: inputs.package == 'jig'
        run: |
          set -eu
          JIG_CI_BUN=$(readlink -f "$(command -v bun)")
          export JIG_CI_BUN
          scripts/ci/provision-github-rootless-host.sh provision
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Build and test selected candidate once
        run: |
          set -eu
          if [ "$RELEASE_PACKAGE" = flow ]; then
            FLOW_NODE=$(command -v node)
            FLOW_NPM=$(command -v npm)
            export FLOW_NODE FLOW_NPM
            scripts/build-flow-sdk-candidate.sh "$RUNNER_TEMP/candidate"
          else
            JIG_NPM=$(command -v npm)
            export JIG_NPM
            scripts/build-jig-candidate.sh "$RUNNER_TEMP/candidate"
          fi

      - name: Require zero Jig host residue
        if: always() && steps.jig_host.outputs.ready == 'true'
        run: scripts/ci/provision-github-rootless-host.sh assert-clean

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.selected.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    environment: npm-alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      id-token: write
    env:
      PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
      RELEASE_PACKAGE: ${{ inputs.package }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Require trusted-publishing npm
        run: |
          set -eu
          npm_version=$(npm --version)
          NPM_VERSION=$npm_version node --input-type=module <<'NODE'
          const parsed = (process.env.NPM_VERSION ?? "").split(".").map(Number);
          if (parsed.length < 3 || parsed.some((part) => !Number.isInteger(part)) ||
              parsed[0] < 11 || (parsed[0] === 11 && parsed[1] < 5) ||
              (parsed[0] === 11 && parsed[1] === 5 && parsed[2] < 1)) {
            throw new Error(`npm >=11.5.1 is required for trusted publishing; found ${process.env.NPM_VERSION}`);
          }
          NODE
          printf 'npm %s\n' "$npm_version"

      - name: Download exact persisted candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate

      - name: Verify persisted candidate
        id: candidate
        run: |
          set -eu
          set -- "$RUNNER_TEMP/candidate"/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "$PACKAGE_NAME did not persist exactly one candidate archive" >&2
            exit 1
          fi
          archive=$1
          filename=$(basename -- "$archive")
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check "$filename.sha256" > /dev/null)
          manifest="$RUNNER_TEMP/candidate-package.json"
          tar -xOzf "$archive" package/package.json > "$manifest"
          CANDIDATE_ARCHIVE="$archive" \
          CANDIDATE_MANIFEST="$manifest" \
          CANDIDATE_SUCCESS="$RUNNER_TEMP/candidate/SUCCESS.json" \
            node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import { basename } from "node:path";

          const archive = process.env.CANDIDATE_ARCHIVE;
          const manifest = JSON.parse(await readFile(process.env.CANDIDATE_MANIFEST, "utf8"));
          const success = JSON.parse(await readFile(process.env.CANDIDATE_SUCCESS, "utf8"));
          const digest = createHash("sha256").update(await readFile(archive)).digest("hex");
          if (manifest.name !== process.env.PACKAGE_NAME || manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error(`candidate manifest mismatch for ${process.env.PACKAGE_NAME}`);
          }
          if (manifest.private === true) {
            throw new Error(`${manifest.name} candidate is still private`);
          }
          if (success.archive !== basename(archive) || success.sha256 !== digest) {
            throw new Error(`${manifest.name} candidate evidence does not match its archive`);
          }
          if (success.commit !== process.env.GITHUB_SHA) {
            throw new Error(`${manifest.name} candidate was not built from this workflow commit`);
          }
          NODE
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Publish or converge exact registry version
        env:
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
        run: |
          set -eu
          presence_error="$RUNNER_TEMP/npm-presence-error"
          if npm view "$PACKAGE_NAME@$RELEASE_VERSION" version --json > /dev/null 2> "$presence_error"; then
            publish_status=0
          elif grep -F 'E404' "$presence_error" > /dev/null; then
            set +e
            npm publish "$ARCHIVE" --access public --tag "$RELEASE_TAG" --provenance --ignore-scripts
            publish_status=$?
            set -e
          else
            echo "npm could not determine whether $PACKAGE_NAME@$RELEASE_VERSION exists" >&2
            sed -n '1,20p' "$presence_error" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/refetched"
          refetched=
          attempt=1
          while [ "$attempt" -le 6 ]; do
            rm -f "$RUNNER_TEMP/refetched"/*.tgz
            if npm pack "$PACKAGE_NAME@$RELEASE_VERSION" \
                --pack-destination "$RUNNER_TEMP/refetched" --ignore-scripts > /dev/null 2>&1; then
              set -- "$RUNNER_TEMP/refetched"/*.tgz
              if [ "$#" -eq 1 ] && [ -f "$1" ]; then
                refetched=$1
                break
              fi
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
            attempt=$((attempt + 1))
          done
          if [ -z "$refetched" ]; then
            echo "npm did not expose $PACKAGE_NAME@$RELEASE_VERSION after six attempts (publish exit $publish_status)" >&2
            exit 1
          fi

          candidate_digest=$(sha256sum "$ARCHIVE")
          candidate_digest=${candidate_digest%% *}
          registry_digest=$(sha256sum "$refetched")
          registry_digest=${registry_digest%% *}
          if [ "$candidate_digest" != "$registry_digest" ]; then
            echo "registry bytes differ from the persisted $PACKAGE_NAME candidate" >&2
            exit 1
          fi

          expected=$(RELEASE_VERSION="$RELEASE_VERSION" node -p 'JSON.stringify(process.env.RELEASE_VERSION)')
          attempt=1
          while [ "$attempt" -le 6 ]; do
            tagged=$(npm view "$PACKAGE_NAME" "dist-tags.$RELEASE_TAG" --json 2> /dev/null || true)
            if [ "$tagged" = "$expected" ]; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
            attempt=$((attempt + 1))
          done
          echo "$PACKAGE_NAME@$RELEASE_VERSION did not converge on the $RELEASE_TAG dist-tag (publish exit $publish_status)" >&2
          exit 1
