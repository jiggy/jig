name: Publish npm prereleases

run-name: Publish pending npm prereleases from ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: npm-prerelease-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package }} candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [flow, jig]
    env:
      RELEASE_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REVISION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Select and validate package
        id: selected
        run: |
          set -eu
          case $RELEASE_PACKAGE in
            flow)
              package_name=@jigging/flow
              manifest=packages/flow-sdk/package.json
              ;;
            jig)
              package_name=@jigging/jig
              manifest=packages/jig/package.json
              ;;
            *)
              echo "package must be flow or jig" >&2
              exit 1
              ;;
          esac
          PACKAGE_MANIFEST=$manifest EXPECTED_NAME=$package_name \
            node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const manifest = JSON.parse(await readFile(process.env.PACKAGE_MANIFEST, "utf8"));
          const prerelease = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|next)(?:\.[0-9A-Za-z-]+)*$/;
          if (manifest.name !== process.env.EXPECTED_NAME || !prerelease.test(manifest.version)) {
            throw new Error(`${process.env.PACKAGE_MANIFEST} must declare one exact alpha or next version for ${process.env.EXPECTED_NAME}`);
          }
          if (manifest.private === true) {
            throw new Error(`${manifest.name} is still private`);
          }
          if (manifest.publishConfig?.access !== "public") {
            throw new Error(`${manifest.name} must publish with public access`);
          }
          NODE
          version=$(PACKAGE_MANIFEST=$manifest node --input-type=module -e \
            'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.env.PACKAGE_MANIFEST, "utf8")).version)')
          artifact_name="npm-candidate-$RELEASE_PACKAGE-$version-$SOURCE_REVISION"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Install exact build tools
        run: |
          set -eu
          npm install --global npm@11.6.2
          npm install --global bun@1.3.3
          npm --version
          bun --version
          bun --revision

      - name: Provision Jig's disposable rootless host
        id: jig_host
        if: matrix.package == 'jig'
        run: |
          set -eu
          JIG_CI_BUN=$(readlink -f "$(command -v bun)")
          export JIG_CI_BUN
          scripts/ci/provision-github-rootless-host.sh provision
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Build and test exact candidate
        run: |
          set -eu
          if [ "$RELEASE_PACKAGE" = flow ]; then
            FLOW_NODE=$(command -v node)
            FLOW_NPM=$(command -v npm)
            export FLOW_NODE FLOW_NPM
            scripts/build-flow-sdk-candidate.sh "$RUNNER_TEMP/candidate"
          else
            JIG_NPM=$(command -v npm)
            export JIG_NPM
            scripts/build-jig-candidate.sh "$RUNNER_TEMP/candidate"
          fi

      - name: Require zero Jig host residue
        if: always() && steps.jig_host.outputs.ready == 'true'
        run: scripts/ci/provision-github-rootless-host.sh assert-clean

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.selected.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact candidates
    needs: build
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      id-token: write
    outputs:
      flow_new: ${{ steps.release.outputs.flow_new }}
      flow_version: ${{ steps.release.outputs.flow_version }}
      jig_new: ${{ steps.release.outputs.jig_new }}
      jig_version: ${{ steps.release.outputs.jig_version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Require trusted-publishing npm
        run: |
          set -eu
          npm_version=$(npm --version)
          NPM_VERSION=$npm_version node --input-type=module <<'NODE'
          const parsed = (process.env.NPM_VERSION ?? "").split(".").map(Number);
          if (parsed.length < 3 || parsed.some((part) => !Number.isInteger(part)) ||
              parsed[0] < 11 || (parsed[0] === 11 && parsed[1] < 5) ||
              (parsed[0] === 11 && parsed[1] === 5 && parsed[2] < 1)) {
            throw new Error(`npm >=11.5.1 is required for trusted publishing; found ${process.env.NPM_VERSION}`);
          }
          NODE
          printf 'npm %s\n' "$npm_version"

      - name: Download exact persisted candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: npm-candidate-*-${{ env.SOURCE_REVISION }}
          path: ${{ runner.temp }}/candidates

      - name: Publish or converge Flow, then Jig
        id: release
        run: |
          set -eu

          publish_candidate() {
            package_kind=$1
            package_name=$2
            set -- "$RUNNER_TEMP"/candidates/npm-candidate-"$package_kind"-*-$SOURCE_REVISION/*.tgz
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "$package_name did not persist exactly one candidate archive" >&2
              exit 1
            fi
            archive=$1
            candidate_directory=$(dirname -- "$archive")
            filename=$(basename -- "$archive")
            (cd "$candidate_directory" && sha256sum --check "$filename.sha256" > /dev/null)
            manifest="$RUNNER_TEMP/$package_kind-package.json"
            tar -xOzf "$archive" package/package.json > "$manifest"

            metadata=$(\
              CANDIDATE_ARCHIVE=$archive \
              CANDIDATE_MANIFEST=$manifest \
              CANDIDATE_SUCCESS="$candidate_directory/SUCCESS.json" \
              EXPECTED_NAME=$package_name \
              node --input-type=module -e '
                import { createHash } from "node:crypto";
                import { readFile } from "node:fs/promises";
                import { basename } from "node:path";
                const archive = process.env.CANDIDATE_ARCHIVE;
                const manifest = JSON.parse(await readFile(process.env.CANDIDATE_MANIFEST, "utf8"));
                const success = JSON.parse(await readFile(process.env.CANDIDATE_SUCCESS, "utf8"));
                const digest = createHash("sha256").update(await readFile(archive)).digest("hex");
                const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|next)(?:\.[0-9A-Za-z-]+)*$/.exec(manifest.version);
                if (manifest.name !== process.env.EXPECTED_NAME || match === null) throw new Error(`candidate manifest mismatch for ${process.env.EXPECTED_NAME}`);
                if (manifest.private === true || manifest.publishConfig?.access !== "public") throw new Error(`${manifest.name} candidate is not public`);
                if (success.archive !== basename(archive) || success.sha256 !== digest) throw new Error(`${manifest.name} candidate evidence does not match its archive`);
                if (success.commit !== process.env.SOURCE_REVISION) throw new Error(`${manifest.name} candidate was not built from the successful CI revision`);
                process.stdout.write(`${manifest.version}\n${match[4]}\n`);
              '
            )
            version=$(printf '%s\n' "$metadata" | sed -n '1p')
            release_tag=$(printf '%s\n' "$metadata" | sed -n '2p')

            presence_error="$RUNNER_TEMP/$package_kind-presence-error"
            new_release=false
            if npm view "$package_name@$version" version --json > /dev/null 2> "$presence_error"; then
              publish_status=0
            elif grep -F 'E404' "$presence_error" > /dev/null; then
              new_release=true
              set +e
              npm publish "$archive" --access public --tag "$release_tag" --provenance --ignore-scripts
              publish_status=$?
              set -e
            else
              echo "npm could not determine whether $package_name@$version exists" >&2
              sed -n '1,20p' "$presence_error" >&2
              exit 1
            fi

            refetched_directory="$RUNNER_TEMP/refetched-$package_kind"
            mkdir -p "$refetched_directory"
            refetched=
            attempt=1
            while [ "$attempt" -le 6 ]; do
              rm -f "$refetched_directory"/*.tgz
              if npm pack "$package_name@$version" \
                  --pack-destination "$refetched_directory" --ignore-scripts > /dev/null 2>&1; then
                set -- "$refetched_directory"/*.tgz
                if [ "$#" -eq 1 ] && [ -f "$1" ]; then
                  refetched=$1
                  break
                fi
              fi
              if [ "$attempt" -lt 6 ]; then sleep 5; fi
              attempt=$((attempt + 1))
            done
            if [ -z "$refetched" ]; then
              echo "npm did not expose $package_name@$version after six attempts (publish exit $publish_status)" >&2
              exit 1
            fi

            candidate_digest=$(sha256sum "$archive")
            candidate_digest=${candidate_digest%% *}
            registry_digest=$(sha256sum "$refetched")
            registry_digest=${registry_digest%% *}
            if [ "$candidate_digest" != "$registry_digest" ]; then
              echo "registry bytes differ from the persisted $package_name candidate; bump its version" >&2
              exit 1
            fi

            expected=$(RELEASE_VERSION=$version node -p 'JSON.stringify(process.env.RELEASE_VERSION)')
            attempt=1
            while [ "$attempt" -le 6 ]; do
              tagged=$(npm view "$package_name" "dist-tags.$release_tag" --json 2> /dev/null || true)
              if [ "$tagged" = "$expected" ]; then break; fi
              if [ "$attempt" -lt 6 ]; then sleep 5; fi
              attempt=$((attempt + 1))
            done
            if [ "$tagged" != "$expected" ]; then
              echo "$package_name@$version did not converge on the $release_tag dist-tag (publish exit $publish_status)" >&2
              exit 1
            fi
            printf '%s_new=%s\n' "$package_kind" "$new_release" >> "$GITHUB_OUTPUT"
            printf '%s_version=%s\n' "$package_kind" "$version" >> "$GITHUB_OUTPUT"
          }

          publish_candidate flow @jigging/flow
          publish_candidate jig @jigging/jig

  tag:
    name: Tag published source
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create or verify annotated package tags
        env:
          FLOW_NEW: ${{ needs.publish.outputs.flow_new }}
          FLOW_VERSION: ${{ needs.publish.outputs.flow_version }}
          GH_TOKEN: ${{ github.token }}
          JIG_NEW: ${{ needs.publish.outputs.jig_new }}
          JIG_VERSION: ${{ needs.publish.outputs.jig_version }}
          SOURCE_REVISION: ${{ env.SOURCE_REVISION }}
        run: |
          set -eu

          converge_tag() {
            tag=$1
            message=$2
            require_current=$3
            if ref_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.type 2> /dev/null); then
              ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
              if [ "$ref_type" = tag ]; then
                target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq .object.sha)
              else
                target=$ref_sha
              fi
              if [ "$require_current" = true ] && [ "$target" != "$SOURCE_REVISION" ]; then
                echo "$tag already names a different source revision" >&2
                exit 1
              fi
              return
            fi
            tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" -f message="$message" -f object="$SOURCE_REVISION" \
              -f type=commit --jq .sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$tag_object" > /dev/null
          }

          converge_tag "flow-v$FLOW_VERSION" "@jigging/flow $FLOW_VERSION" "$FLOW_NEW"
          converge_tag "jig-v$JIG_VERSION" "@jigging/jig $JIG_VERSION" "$JIG_NEW"
