name: Release versions
on:
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-version-main
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      artifact-id: ${{ steps.prepared.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - run: bun install --ignore-scripts
      - name: Plan the current main release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "A newer main revision owns the release PR."
            printf '%s\n' '## Version generation' '' 'A newer main revision owns the release PR.' >> "$GITHUB_STEP_SUMMARY"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release/cli.mjs plan --output "$RUNNER_TEMP/release-plan.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const plan = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-plan.json`, 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `pending=${plan.pendingChangesets.length > 0}\n`)
          const publisher = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/workflows/npm-publish.yml`
          const status = plan.pendingChangesets.length > 0
            ? 'Pending changesets will update the generated release PR.'
            : 'No pending changesets require a version PR.'
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Version generation\n\n${status}\n\nThis workflow prepares versions. [The npm publisher](${publisher}) reports qualification and publication.\n`)
          NODE
      - name: Generate release changes without repository write authority
        if: steps.plan.outputs.pending == 'true'
        run: |
          just release-version
          node scripts/release/prepared.mjs create "$RUNNER_TEMP/release-changes.json"
      - name: Retain prepared release data
        if: steps.plan.outputs.pending == 'true'
        id: prepared
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-changes-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-changes.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false
  version:
    needs: generate
    if: github.ref == 'refs/heads/main' && needs.generate.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Check current main before repository writes
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current_main" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main revision owns the release PR."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the exact prepared release artifact
        if: steps.current.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact-id }}
          path: ${{ runner.temp }}/prepared-release
          merge-multiple: true
      - name: Validate prepared changes and restore the inert workspace lock
        if: steps.current.outputs.current == 'true'
        run: node scripts/release/prepared.mjs restore-lock "$RUNNER_TEMP/prepared-release/release-changes.json"
      - name: Explain and validate release setup
        if: steps.current.outputs.current == 'true'
        id: release-setup
        env:
          HAS_RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID != '' }}
          HAS_RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          settings_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings"
          printf '%s\n' '## Release setup' '' >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_RELEASE_APP_ID" != "$HAS_RELEASE_APP_PRIVATE_KEY" ]; then
            if [ "$HAS_RELEASE_APP_ID" = 'true' ]; then
              missing='secret RELEASE_APP_PRIVATE_KEY'
              settings_path='secrets/actions'
            else
              missing='variable RELEASE_APP_ID'
              settings_path='variables/actions'
            fi
            echo "::error::Incomplete release App configuration: missing $missing. Add it, or remove the other App setting to use GITHUB_TOKEN."
            printf '%s\n' \
              "**Release App configuration is incomplete: $missing is missing.**" \
              "Add it under [Settings → Secrets and variables → Actions]($settings_url/$settings_path)." \
              'Or remove the other App setting to use the built-in token.' '' \
              'After correction, choose **Re-run all jobs**, or dispatch **Release versions** on current **main**.' \
              'Do not choose **Re-run failed jobs**: each attempt requires a newly generated artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$HAS_RELEASE_APP_ID" = 'true' ]; then
            printf '%s\n' \
              'Using the configured release GitHub App.' \
              'It must be installed on this repository with **Contents: write** and **Pull requests: write**.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' \
              'Using **GITHUB_TOKEN**. **No App secrets are required.**' '' \
              "Open [Settings → Actions → General]($settings_url/actions)." \
              'Under **Workflow permissions**, enable **Allow GitHub Actions to create and approve pull requests**.' \
              'An organization policy may require an organization owner to enable this option.' '' \
              'A maintainer must approve workflows if requested and merge the PR after required checks and reviews.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create repository-scoped release token
        if: steps.current.outputs.current == 'true' && vars.RELEASE_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Maintain the release pull request
        if: steps.current.outputs.current == 'true'
        id: version
        # v2.1.2 reads workspace data with bundled dependencies. Its custom
        # script applies prepared data without running the installed CLI.
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: node scripts/release/prepared.mjs apply "${{ runner.temp }}/prepared-release/release-changes.json"
          commit-message: "chore: version Jig packages"
          pr-title: "Release Jig packages"
          pr-base-branch: main
          push-with-git-cli: false
      - name: Explain release PR failure and recovery
        if: failure() && (steps.app-token.outcome == 'failure' || steps.version.outcome == 'failure')
        run: |
          printf '%s\n' '## Release PR automation failed' '' \
            'Inspect the failed step for the exact error.' '' \
            'After correction, choose **Re-run all jobs**, or dispatch **Release versions** on current **main**.' \
            'Do not choose **Re-run failed jobs**: each attempt requires a newly generated artifact.' >> "$GITHUB_STEP_SUMMARY"
      - name: Request automatic merge under repository policy
        if: steps.version.outputs.pr-number != '' && steps.app-token.outputs.token != '' && vars.RELEASE_AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          release_head=$(gh pr view "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          gh pr merge "$RELEASE_PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$release_head"
      - name: Explain the built-in token handoff
        if: steps.version.outputs.pr-number != '' && steps.app-token.outputs.token == ''
        env:
          RELEASE_PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          release_pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$RELEASE_PR_NUMBER"
          printf '%s\n' '## Release PR ready for a maintainer' '' \
            "Open [release PR #$RELEASE_PR_NUMBER]($release_pr_url)." \
            'This PR uses **GITHUB_TOKEN**. No App secrets are required.' '' \
            'If shown, select **Approve workflows to run** on the PR.' \
            'Wait for the required checks and reviews, then merge it as a maintainer.' \
            'The human merge starts the required main-push qualification.' \
            'Do not substitute a manually dispatched check run for that evidence.' >> "$GITHUB_STEP_SUMMARY"
