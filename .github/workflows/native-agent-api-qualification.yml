name: Native Agent API qualification

run-name: Native Agent API qualification for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Linux host conformance]
    types: [completed]

env:
  SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read

jobs:
  qualification:
    name: ${{ matrix.client }} — Ubuntu 24.04
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: native-agent-api
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - client: codex
            # Native Codex sends no output-token cap. Free routing avoids an
            # unfunded maximum-token reservation without modifying its request.
            model: openrouter/free
            test-pattern: Responses-compatible endpoint
          - client: claude
            model: mistralai/ministral-8b-2512
            test-pattern: Anthropic-compatible endpoint
          - client: pi
            model: mistralai/ministral-8b-2512
            test-pattern: explicit built-in API provider
    steps:
      - name: Check out the tested source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.43.1'

      - name: Install exact Bun test tool
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Retain exact Bun executable
        env:
          JIG_CI_BUN: ${{ steps.setup-bun.outputs.bun-path }}
        run: printf 'JIG_CI_BUN=%s\n' "$JIG_CI_BUN" >> "$GITHUB_ENV"

      - name: Provision the disposable rootless host
        id: host
        run: |
          scripts/ci/provision-github-rootless-host.sh provision
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Install source-test dependencies
        run: >-
          bun install --ignore-scripts --filter @jigging/jig
          --filter @jigging/agent-method --filter @jigging/flow-authoring
          --filter @jigging/agent-acp
          --filter @jigging/flow

      - name: Build source-test workspace packages
        run: just --justfile packages/jig/justfile build

      - name: Find successful Linux host run for this source
        id: host-run
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TRIGGER_RUN_ID" ]]; then
            host_run_id=$TRIGGER_RUN_ID
          else
            host_run_id=$(gh api --method GET -f per_page=100 \
              "repos/$GITHUB_REPOSITORY/actions/workflows/linux-host-conformance.yml/runs" |
              jq -r --arg revision "$SOURCE_REVISION" \
                '[.workflow_runs[] | select(.head_sha == $revision and .head_branch == "main" and .conclusion == "success" and .event == "push")] | sort_by(.created_at) | last | .id // empty')
            if [[ -z "$host_run_id" ]]; then
              echo "No successful main-push Linux host run exists for $SOURCE_REVISION" >&2
              exit 1
            fi
          fi
          printf 'run_id=%s\n' "$host_run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact Linux host archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-host-artifacts-${{ env.SOURCE_REVISION }}
          path: ${{ runner.temp }}/linux-host-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.host-run.outputs.run_id }}

      - name: Identify and verify the frozen archives
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/linux-host-artifacts"
          (
            cd "$artifact_directory"
            sha256sum --check SHA256SUMS
          )
          one_archive() {
            local -a archives
            mapfile -t archives < <(find "$1" -maxdepth 1 -type f -name '*.tgz' -print)
            if [[ ${#archives[@]} -ne 1 ]]; then
              echo "expected exactly one archive in $1" >&2
              return 1
            fi
            readlink -f "${archives[0]}"
          }
          {
            printf 'FLOW_SDK_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/flow-sdk")"
            printf 'AGENT_METHOD_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/agent-method")"
            printf 'AGENT_ACP_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/agent-acp")"
            printf 'JIG_PACKAGE_ARCHIVE=%s\n' "$(one_archive "$artifact_directory/jig")"
            printf 'JIG_CI_ARCHIVE_DIRECTORY=%s\n' "$artifact_directory"
          } >> "$GITHUB_ENV"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Install current native Codex
        if: matrix.client == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/native-codex"
          mkdir -p "$install_root"
          npm install --prefix "$install_root" --ignore-scripts --no-audit --no-fund '@openai/codex@latest'
          codex_version=$(node -p "require('$install_root/node_modules/@openai/codex/package.json').version")
          mapfile -t paths < <(find "$install_root/node_modules" -type f -path '*/vendor/x86_64-unknown-linux-musl/bin/codex' -print)
          if [[ ${#paths[@]} -ne 1 || ! -x "${paths[0]}" ]]; then
            echo "expected one native x86-64 Codex executable from @latest" >&2
            exit 1
          fi
          agent_path=$(realpath "${paths[0]}")
          identity=$("$agent_path" --version)
          if [[ "$identity" != "codex-cli $codex_version" ]]; then
            echo "Codex package and native executable versions differ: $codex_version / $identity" >&2
            exit 1
          fi
          printf 'NATIVE_AGENT_PATH=%s\nNATIVE_AGENT_VERSION=%s\n' "$agent_path" "$identity" >> "$GITHUB_ENV"
          printf 'Installed Codex from @latest: `%s`\n' "$identity" >> "$GITHUB_STEP_SUMMARY"

      - name: Install current native Claude Code
        if: matrix.client == 'claude'
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/native-claude-code"
          mkdir -p "$install_root"
          npm install --prefix "$install_root" --ignore-scripts --no-audit --no-fund '@anthropic-ai/claude-code@latest'
          claude_version=$(node -p "require('$install_root/node_modules/@anthropic-ai/claude-code/package.json').version")
          mapfile -t paths < <(find "$install_root/node_modules/@anthropic-ai" -type f -path '*/claude-code-linux-x64/claude' -print)
          if [[ ${#paths[@]} -ne 1 || ! -x "${paths[0]}" ]]; then
            echo "expected one native x86-64 Claude Code executable from @latest" >&2
            exit 1
          fi
          agent_path=$(realpath "${paths[0]}")
          identity=$("$agent_path" --version)
          if [[ "$identity" != *"$claude_version"* ]]; then
            echo "Claude Code package and native executable versions differ: $claude_version / $identity" >&2
            exit 1
          fi
          printf 'NATIVE_AGENT_PATH=%s\nNATIVE_AGENT_VERSION=%s\n' "$agent_path" "$identity" >> "$GITHUB_ENV"
          printf 'Installed Claude Code from @latest: `%s`\n' "$identity" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the supported standalone Pi profile
        if: matrix.client == 'pi'
        shell: bash
        run: |
          set -euo pipefail
          pi_version=0.84.4
          install_root="$RUNNER_TEMP/native-pi-$pi_version"
          mkdir -p "$install_root"
          archive="$RUNNER_TEMP/pi-linux-x64.tar.gz"
          checksums="$RUNNER_TEMP/pi-SHA256SUMS"
          release="https://github.com/earendil-works/pi/releases/download/v$pi_version"
          curl --fail --location --retry 3 --silent --show-error "$release/pi-linux-x64.tar.gz" -o "$archive"
          curl --fail --location --retry 3 --silent --show-error "$release/SHA256SUMS" -o "$checksums"
          expected=$(awk '$2 == "pi-linux-x64.tar.gz" { print $1; exit }' "$checksums")
          actual=$(sha256sum "$archive" | cut -d ' ' -f 1)
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "Pi release archive does not match its published SHA256SUMS entry" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$install_root"
          mapfile -t paths < <(find "$install_root" -type f -name pi -print)
          if [[ ${#paths[@]} -ne 1 || ! -x "${paths[0]}" ]]; then
            echo "expected one native Pi executable from the supported v$pi_version release" >&2
            exit 1
          fi
          agent_path=$(realpath "${paths[0]}")
          identity=$("$agent_path" --version)
          if [[ "$identity" != *"$pi_version"* ]]; then
            echo "unexpected native Pi version: $identity" >&2
            exit 1
          fi
          printf 'NATIVE_AGENT_PATH=%s\nNATIVE_AGENT_VERSION=%s\n' "$agent_path" "$identity" >> "$GITHUB_ENV"
          printf 'Installed supported Pi profile: `%s`\n' "$identity" >> "$GITHUB_STEP_SUMMARY"

      - name: Qualify native ${{ matrix.client }} API-key ACP through OpenRouter
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JIG_NATIVE_API_CLIENT: ${{ matrix.client }}
          JIG_NATIVE_API_MODEL: ${{ matrix.model }}
          JIG_NATIVE_API_TEST_PATTERN: ${{ matrix.test-pattern }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "Configure OPENROUTER_API_KEY in the protected native-agent-api environment." >&2
            exit 1
          fi
          case "$JIG_NATIVE_API_CLIENT" in
            codex)
              client_environment=(
                "JIG_CODEX_PROOF_PATH=$NATIVE_AGENT_PATH"
                "JIG_CODEX_RESPONSES_MODEL=$JIG_NATIVE_API_MODEL"
              )
              ;;
            claude)
              client_environment=(
                "JIG_CLAUDE_PROOF_PATH=$NATIVE_AGENT_PATH"
                "JIG_CLAUDE_ANTHROPIC_MODEL=$JIG_NATIVE_API_MODEL"
              )
              ;;
            pi)
              client_environment=(
                "JIG_PI_PROOF_PATH=$NATIVE_AGENT_PATH"
                "JIG_PI_API_PROVIDER=openrouter"
                "JIG_PI_API_MODEL=$JIG_NATIVE_API_MODEL"
              )
              ;;
            *)
              echo "unsupported native client: $JIG_NATIVE_API_CLIENT" >&2
              exit 2
              ;;
          esac
          scripts/ci/provision-github-rootless-host.sh run-delegated \
            env JIG_LINUX_ROOTLESS_HOSTILE=1 \
            "AGENT_METHOD_PACKAGE_ARCHIVE=$AGENT_METHOD_PACKAGE_ARCHIVE" \
            "AGENT_ACP_PACKAGE_ARCHIVE=$AGENT_ACP_PACKAGE_ARCHIVE" \
            "FLOW_SDK_PACKAGE_ARCHIVE=$FLOW_SDK_PACKAGE_ARCHIVE" \
            "JIG_PACKAGE_ARCHIVE=$JIG_PACKAGE_ARCHIVE" \
            "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" \
            "JIG_NATIVE_API_MODEL=$JIG_NATIVE_API_MODEL" \
            "JIG_NATIVE_API_CLIENT=$JIG_NATIVE_API_CLIENT" \
            "JIG_NATIVE_API_TEST_PATTERN=$JIG_NATIVE_API_TEST_PATTERN" \
            "${client_environment[@]}" \
            "$JIG_CI_BUN" test packages/jig/test/root-agent-run-lifecycle.test.ts \
            --test-name-pattern "$JIG_NATIVE_API_TEST_PATTERN" \
            --timeout 420000

      - name: Verify the tested archives are unchanged
        if: always() && steps.archives.outputs.ready == 'true'
        run: cd "$JIG_CI_ARCHIVE_DIRECTORY" && sha256sum --check SHA256SUMS

      - name: Require zero host residue
        if: always() && steps.host.outputs.ready == 'true'
        run: scripts/ci/provision-github-rootless-host.sh assert-clean
