name: Queued worker cancellation probe

on:
  push:
    branches: [work/ci-queued-worker-probe-20261103]

permissions:
  actions: read

jobs:
  queue-probe:
    name: Queue cancellation probe / ${{ matrix.kind }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 2
    continue-on-error: false
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - kind: guard
            runner: ubuntu-24.04
          - kind: unallocated
            runner: [self-hosted, jig-queue-probe-20261103-d38e08514248421f9d3360d28af48e1d]
    steps:
      - name: Observe the queued sibling, then fail after two real seconds
        if: ${{ matrix.kind == 'guard' }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          const run = Number(env.GITHUB_RUN_ID), attempt = Number(env.GITHUB_RUN_ATTEMPT);
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(env.GITHUB_REPOSITORY ?? '') || !Number.isSafeInteger(run) || run <= 0 || !Number.isSafeInteger(attempt) || attempt <= 0 || !/^[0-9a-f]{40}$/.test(env.GITHUB_SHA ?? '') || !env.GH_TOKEN) throw Error('Invalid probe identity');
          const deadline = Date.now() + 45_000;
          const label = 'jig-queue-probe-20261103-d38e08514248421f9d3360d28af48e1d';
          const registrationStates = new Set(['queued', 'waiting', 'pending', 'requested']);
          const statuses = new Set([...registrationStates, 'in_progress', 'completed']);
          const conclusions = new Set(['success', 'failure', 'neutral', 'cancelled', 'skipped', 'timed_out', 'action_required', 'stale', 'startup_failure']);
          let observedSiblingId;
          const readSibling = async () => {
            const url = `https://api.github.com/repos/${env.GITHUB_REPOSITORY}/actions/runs/${run}/attempts/${attempt}/jobs?per_page=100`;
            const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(5000), headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
            if (!response.ok) throw Error(`Probe inventory failed (HTTP ${response.status})`);
            const body = await response.json();
            if (!Array.isArray(body.jobs) || body.total_count !== body.jobs.length || body.total_count > 2) throw Error('Incomplete or unexpected probe inventory');
            const matches = body.jobs.filter(job => job.name === 'Queue cancellation probe / unallocated');
            if (matches.length > 1) throw Error('Ambiguous queued sibling');
            if (!matches.length) {
              console.log(JSON.stringify({ event: 'sibling-registration', run, attempt, jobId: null, status: null, conclusion: null, runnerId: null, runnerNameEmpty: null, stepCount: null, hasExactLabel: null }));
              return undefined;
            }
            const job = matches[0];
            if (job.run_id !== run || job.run_attempt !== attempt || job.head_sha !== env.GITHUB_SHA || !Number.isSafeInteger(job.id) || job.id <= 0) throw Error('Foreign queued sibling');
            if (observedSiblingId !== undefined && observedSiblingId !== job.id) throw Error('Registered sibling identity changed');
            observedSiblingId = job.id;
            console.log(JSON.stringify({ event: 'sibling-registration', run, attempt, jobId: job.id, status: job.status == null ? null : statuses.has(job.status) ? job.status : 'invalid', conclusion: job.conclusion == null ? null : conclusions.has(job.conclusion) ? job.conclusion : 'invalid', runnerId: Number.isSafeInteger(job.runner_id) && job.runner_id >= 0 ? job.runner_id : null, runnerNameEmpty: typeof job.runner_name === 'string' ? job.runner_name === '' : null, stepCount: Array.isArray(job.steps) ? job.steps.length : null, hasExactLabel: Array.isArray(job.labels) ? job.labels.includes(label) : null }));
            if (job.status === 'in_progress' || job.status === 'completed' || job.conclusion != null || (Number.isSafeInteger(job.runner_id) && job.runner_id > 0) || (typeof job.runner_name === 'string' && job.runner_name !== '') || (Array.isArray(job.steps) && job.steps.length > 0)) throw Error('Sibling acquired a runner or execution state');
            if ((job.status != null && !registrationStates.has(job.status)) || (job.runner_id != null && (!Number.isSafeInteger(job.runner_id) || job.runner_id < 0)) || (job.runner_name != null && typeof job.runner_name !== 'string') || (job.steps != null && !Array.isArray(job.steps)) || (job.labels != null && (!Array.isArray(job.labels) || job.labels.some(value => typeof value !== 'string')))) throw Error('Invalid sibling registration metadata');
            const noRunner = (job.runner_id === null && job.runner_name === null) || (job.runner_id === 0 && job.runner_name === '');
            if (job.status !== 'queued' || job.conclusion !== null || !noRunner || !Array.isArray(job.steps) || job.steps.length !== 0 || !job.labels?.includes(label)) return undefined;
            return job;
          };
          let sibling;
          while (Date.now() < deadline && !(sibling = await readSibling())) {
            const waitMs = Math.max(0, Math.min(1000, deadline - Date.now()));
            await new Promise(resolve => setTimeout(resolve, waitMs));
          }
          if (!sibling || Date.now() >= deadline) throw Error('Queued sibling was not observed within 45 seconds');
          const observed = performance.now();
          console.log(JSON.stringify({ event: 'queued-sibling-observed', run, attempt, jobId: sibling.id, runnerId: sibling.runner_id, runnerName: sibling.runner_name, steps: 0, observedAt: new Date().toISOString() }));
          await new Promise(resolve => setTimeout(resolve, 2000));
          if ((await readSibling())?.id !== sibling.id) throw Error('Queued sibling changed during the real wait');
          console.log(JSON.stringify({ event: 'intentional-guard-failure', run, attempt, jobId: sibling.id, waitedMs: performance.now() - observed, failedAt: new Date().toISOString() }));
          process.exitCode = 1;
          NODE
      - name: Reject an unexpected allocation of the deliberately absent runner
        if: ${{ matrix.kind == 'unallocated' }}
        run: |
          echo '::error::This probe required an unallocated sibling; unexpected runner allocation invalidates it.'
          exit 1
