# Temporary manual diagnostic. Never merge this replacement into main.
name: Ordinary installed Codex consumer diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  public-consumer:
    if: github.repository == 'jiggy/jig' && github.ref != 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: 812c0c8f67a4e979ab005e2bcb29e4af47138cb6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Download exact immutable canonical CI bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 44104215900
          artifact-ids: 14337327260
          merge-multiple: true
          path: ${{ runner.temp }}/canonical
      - name: Verify canonical source and package bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          node scripts/ci/candidate-provenance.mjs verify "$RUNNER_TEMP/canonical" --source "$EXPECTED_SOURCE"
          mkdir "$RUNNER_TEMP/public-evidence"
          sw_vers > "$RUNNER_TEMP/public-evidence/host.txt"
          bun --revision >> "$RUNNER_TEMP/public-evidence/host.txt"
          for pair in 'JIG_PACKAGE_ARCHIVE jig' 'FLOW_SDK_PACKAGE_ARCHIVE flow-sdk' 'AGENT_ACP_PACKAGE_ARCHIVE agent-acp'; do
            read -r variable package <<< "$pair"
            archives=("$RUNNER_TEMP/canonical/$package/"*.tgz)
            test "${#archives[@]}" = 1
            test -f "${archives[0]}"
            printf '%s=%s\n' "$variable" "${archives[0]}" >> "$GITHUB_ENV"
          done
      - name: Install genuine pinned native clients
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/ci/install-macos-test-clients.ts "$RUNNER_TEMP/native-clients" >> "$GITHUB_ENV"
      - name: Prepare an ordinary project outside the repository without submitting work
        shell: bash
        run: |
          set -euo pipefail
          export FLOW_NODE="$(command -v node)"
          export JIG_AUTHORING_NODE_PATH="$FLOW_NODE"
          bun .tmp/mac-codex-public-consumer/prepare.mjs "$RUNNER_TEMP/ordinary-codex-consumer"
      - name: Start genuine Codex through public installed interfaces and cancel this fresh identity once
        shell: bash
        run: |
          set -euo pipefail
          export FLOW_NODE="$(command -v node)"
          export JIG_AUTHORING_NODE_PATH="$FLOW_NODE"
          snapshot() {
            { launchctl list | awk 'NR > 1 && $3 ~ /^org\.jig\./ {print "job " $3}'; mount | awk '/jig-| on \/Volumes\/Jig-/ {print "mount " $0}'; ps -axo pid=,comm= | awk '/macos-native-supervisor|macos-exec|\/jig-guardian-/ {print "process " $1}'; } | LC_ALL=C sort
          }
          snapshot > "$RUNNER_TEMP/public-evidence/before.txt"
          status=0
          bun "$RUNNER_TEMP/ordinary-codex-consumer/driver.ts" 2>&1 | tee "$RUNNER_TEMP/public-evidence/driver.txt" || status=$?
          snapshot > "$RUNNER_TEMP/public-evidence/after.txt"
          diff -u "$RUNNER_TEMP/public-evidence/before.txt" "$RUNNER_TEMP/public-evidence/after.txt" || status=1
          if [[ -f "$RUNNER_TEMP/ordinary-codex-consumer/evidence/summary.json" ]]; then
            cp "$RUNNER_TEMP/ordinary-codex-consumer/evidence/summary.json" "$RUNNER_TEMP/public-evidence/summary.json"
          fi
          exit "$status"
      - name: Retain only closed public diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ordinary-codex-public-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-evidence
          retention-days: 7
          if-no-files-found: ignore
