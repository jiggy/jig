# Temporary native-development workflow. Never merge this replacement into main.
# It produces diagnostic native bytes and same-byte tests, not qualification receipts.
name: Mac Codex ARM development diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-codex-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-test-oldest:
    name: Native development — macOS 26
    if: github.repository == 'jiggy/jig' && github.ref != 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.native-assets.outputs.artifact-id }}
    env:
      JIG_MACOS_PROCESS_TEST: "1"
      JIG_NATIVE_AGENT_STARTUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - name: Record diagnostic source and genuine native host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          mkdir "$RUNNER_TEMP/native-diagnostics"
          {
            printf 'DIAGNOSTIC ONLY. No canonical candidate or qualification receipt.\n'
            git rev-parse HEAD
            uname -a
            sw_vers
            xcrun --show-sdk-version
            xcrun clang --version
            bun --revision
          } > "$RUNNER_TEMP/native-diagnostics/host.txt"
      - name: Verify the exact checked-in compiler-produced native assets
        shell: bash
        run: |
          set -euo pipefail
          bun packages/jig/scripts/native-support.mjs check
          node --input-type=module - <<'JS'
          import { createHash } from 'node:crypto'
          import { cpSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { dirname, join } from 'node:path'
          const files = [
            'packages/jig/support/macos-exec-universal',
            'packages/jig/support/macos-descriptor-bridge.dylib',
            'packages/jig/support/macos-codex-preferences-universal',
            'packages/jig/support/macos-native-build.json',
            'packages/jig/src/internal/macos-descriptor-files.ts',
            'packages/jig/src/internal/installed-bun-support.ts',
          ]
          const root = join(process.env.RUNNER_TEMP, 'native-development-assets')
          const hashes = {}
          for (const file of files) {
            const target = join(root, file)
            mkdirSync(dirname(target), {recursive:true})
            cpSync(file, target)
            hashes[file] = createHash('sha256').update(readFileSync(target)).digest('hex')
          }
          writeFileSync(join(root, 'NATIVE-DEVELOPMENT.json'), JSON.stringify({
            schemaVersion:1, diagnosticOnly:true, sourceRevision:process.env.GITHUB_SHA,
            producerRunId:process.env.GITHUB_RUN_ID, producerRunAttempt:process.env.GITHUB_RUN_ATTEMPT,
            files:hashes,
          }, null, 2) + '\n', {flag:'wx'})
          JS
      - name: Retain exact generated assets before diagnostic tests
        id: native-assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-development-assets-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-development-assets
          retention-days: 7
          if-no-files-found: error
      - name: Build the ordinary workspace and install genuine offline clients
        shell: bash
        run: |
          set -euo pipefail
          bun install --ignore-scripts
          just --justfile packages/jig/justfile build
          bun scripts/ci/install-macos-test-clients.ts "$RUNNER_TEMP/jig-native-clients" >> "$GITHUB_ENV"
      - name: Test the Codex boundary and complete offline native client startup
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            packages/jig/test/macos/macos-codex-preferences.test.ts \
            packages/jig/test/macos/macos-preferences-boundary.test.ts \
            packages/jig/test/macos/macos-preferences-observer.test.ts \
            packages/jig/test/startup/native-agent-startup.test.ts \
            --timeout 420000 --reporter=junit \
            --reporter-outfile="$RUNNER_TEMP/native-diagnostics/native-tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/native-diagnostics/native-tests.txt"
      - name: Observe actual forced policy on this disposable guest
        if: ${{ !cancelled() && steps.native-assets.outcome == 'success' }}
        env:
          JIG_DISPOSABLE_MAC_POLICY_DIAGNOSTIC: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp/forced-policy-positive/run.py "$PWD/packages/jig" | tee "$RUNNER_TEMP/native-diagnostics/forced-policy.json"
      - name: Retain bounded public synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-development-macos26-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-diagnostics
          retention-days: 7
          if-no-files-found: ignore
