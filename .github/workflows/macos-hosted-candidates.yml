name: macOS hosted candidates
run-name: Captured evaluator stdin experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluator-experiment:
    name: Actual captured evaluator experiment
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Require an exact supported Apple Silicon host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(uname -r)" = 24.6.0
          case "$(sw_vers -buildVersion)" in 24G830|24H232) ;; *) exit 1 ;; esac
          sw_vers -buildVersion
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Build and execute the real captured worker and SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          chmod 700 .tmp
          cat > .tmp/mac-evaluator-experiment.ts <<'JIG_EVALUATOR_EXPERIMENT'
          import assert from 'node:assert/strict'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { chmod, mkdir, mkdtemp, readFile, readdir, realpath, rm, writeFile } from 'node:fs/promises'
          import { join } from 'node:path'
          import { performance } from 'node:perf_hooks'
          import { privateAuthorEvaluatorProgram } from '../packages/jig/src/internal/project-evaluator-program.js'
          import {
            PRIVATE_AUTHOR_EVALUATOR_MAX_PROGRAM_BYTES,
            PRIVATE_AUTHOR_EVALUATOR_MAX_REQUEST_BYTES,
          } from '../packages/jig/src/internal/project-evaluator-policy.js'
          
          assert.equal(process.platform, 'darwin')
          assert.equal(process.arch, 'arm64')
          assert.equal(Bun.version, '1.4.2')
          const sourceRoot = process.cwd()
          const work = await realpath(await mkdtemp(join(process.env.RUNNER_TEMP!, 'jig-evaluator-experiment-')))
          await chmod(work, 0o700)
          const worker = join(work, 'project-evaluator-worker.js')
          const sdk = join(work, 'project-evaluator-sdk.bundle.js')
          const empty = join(work, 'empty')
          await mkdir(empty, {mode:0o700})
          const deadline = performance.now() + 5 * 60_000
          const run = (args: string[], input?: Uint8Array, cwd = empty, timeout = 30_000) => {
            const remaining = deadline - performance.now()
            assert(remaining > 0, 'experiment deadline expired')
            const child = spawnSync(process.execPath,
              ['--no-env-file', '--no-install', '--config=/dev/null', ...args], {
                cwd,
                env: { PATH: '/usr/bin:/bin', LC_ALL: 'C', BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0' },
                input,
                timeout: Math.min(timeout, Math.floor(remaining)),
                killSignal: 'SIGKILL',
                maxBuffer: 17 * 1024 * 1024,
              })
            assert.equal(child.error, undefined, 'bounded Bun process failed')
            assert.equal(child.signal, null, 'Bun process was terminated')
            assert.equal(child.status, 0, 'Bun process failed')
            return child.stdout
          }
          const digest = (bytes: Uint8Array) => `sha256:${createHash('sha256').update(bytes).digest('hex')}`
          const results: object[] = []
          try {
            run(['build', 'packages/jig/src/internal/project-evaluator-worker.ts', '--target=bun', '--format=esm', `--outfile=${worker}`], undefined, sourceRoot)
            run(['build', 'packages/jig/src/project/evaluator-sdk-entry.ts', '--target=bun', '--format=esm', `--outfile=${sdk}`], undefined, sourceRoot)
            const [workerBytes, sdkBytes] = await Promise.all([readFile(worker), readFile(sdk)])
            const decoder = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true })
            const support = Object.freeze({ workerSource: decoder.decode(workerBytes), sdkSource: decoder.decode(sdkBytes) })
            console.log(JSON.stringify({ kind:'metadata', sourceRevision:process.env.GITHUB_SHA,
              bun:Bun.version, workerDigest:digest(workerBytes), sdkDigest:digest(sdkBytes),
              workerBytes:workerBytes.length, sdkBytes:sdkBytes.length }))
            const request = (entries: string[], modules: object[]) => new TextEncoder().encode(JSON.stringify({
              protocol:'jig-author-evaluator/1', authoringProfile:'project-authoring/1', entries, modules,
            }))
            const evaluate = async (name: string, entries: string[], modules: object[]) => {
              const program = privateAuthorEvaluatorProgram(request(entries, modules), support)
              const started = performance.now()
              const output = run(['run', '-'], program, empty, 40_000)
              const elapsedMs = performance.now() - started
              assert.deepEqual(await readdir(empty), [], 'stdin evaluation wrote a temporary file')
              const response = JSON.parse(output.toString())
              assert.equal(response.protocol, 'jig-author-evaluator/1')
              const result = { name, elapsedMs, programBytes:program.byteLength, status:response.status, code:response.code ?? null }
              results.push(result)
              console.log(JSON.stringify(result))
              return response
            }
            const single = [{ projectPath:'jig.ts', imports:[], source:'import { defineJig } from "@jigging/jig"; export default defineJig({flows:[]});' }]
            for (let round = 0; round < 5; round++) {
              const response = await evaluate(`single-${round}`, ['jig.ts'], single)
              assert.equal(response.status, 'ok')
              assert.deepEqual(response.values, [{ flows:{ kind:'members', paths:[] } }])
            }
            const poison = [
              { projectPath:'jig.ts', imports:[{specifier:'./shared.ts', projectPath:'shared.ts'}],
                source:'import { defineJig } from "@jigging/jig"; import { count } from "./shared.ts"; globalThis.poison=true; defineJig.poison=true; if(count!==1) throw Error("state"); export default defineJig({flows:[]});' },
              { projectPath:'bindings/a.ts', imports:[{specifier:'../shared.ts', projectPath:'shared.ts'}],
                source:'import { defineJig, defineBinding } from "@jigging/jig"; import { count } from "../shared.ts"; if(globalThis.poison||defineJig.poison||count!==1) throw Error("leak"); export default defineBinding({package:"flows/work",settings:{count}});' },
              { projectPath:'shared.ts', imports:[], source:'globalThis.count=(globalThis.count??0)+1; export const count=globalThis.count;' },
            ]
            // A later child must not reopen either installed-support pathname.
            await writeFile(worker, 'throw Error("mutated worker must not execute")')
            await writeFile(sdk, 'throw Error("mutated SDK must not execute")')
            for (let round = 0; round < 5; round++) {
              const response = await evaluate(`batch-captured-${round}`, ['jig.ts','bindings/a.ts'], poison)
              assert.equal(response.status, 'ok')
              assert.equal(response.values.length, 2)
              assert.deepEqual(response.values[1].settings, {count:1})
            }
            const hostile = '";globalThis.injected=true;// ` ${globalThis.injected=true} \u2028 \u2029 😀 __proto__'
            const escaped = await evaluate('escaped-data', ['bindings/a.ts'], [{ projectPath:'bindings/a.ts', imports:[],
              source:`import {defineBinding} from "@jigging/jig"; const text=${JSON.stringify(hostile)}; if(globalThis.injected) throw Error("escaped"); export default defineBinding({package:"flows/work",settings:{text}});` }])
            assert.equal(escaped.status, 'ok')
            assert.equal(escaped.values[0].settings.text, hostile)
            const denied = await evaluate('denied-filesystem-import', ['jig.ts'], [{ projectPath:'jig.ts', imports:[],
              source:'import fs from "node:fs"; export default {};' }])
            assert.equal(denied.status, 'error')
            assert.equal(denied.code, 'PROJECT_EVALUATOR_IMPORT')
            assert.throws(() => privateAuthorEvaluatorProgram(new Uint8Array(PRIVATE_AUTHOR_EVALUATOR_MAX_REQUEST_BYTES+1), support), /request exceeds/)
            assert.throws(() => privateAuthorEvaluatorProgram(new Uint8Array(), { workerSource:'"'.repeat(PRIVATE_AUTHOR_EVALUATOR_MAX_PROGRAM_BYTES/2), sdkSource:'' }), /program exceeds/)
            console.log(JSON.stringify({kind:'summary', status:'passed', cases:results.length, cwdUnchanged:true,
              requestAndProgramBounds:true, capturedSupportAfterMutation:true, crossEntryIsolation:true}))
          } finally {
            await rm(work, {recursive:true, force:true})
          }
          
          JIG_EVALUATOR_EXPERIMENT
          bun --no-env-file --no-install --config=/dev/null .tmp/mac-evaluator-experiment.ts
          
