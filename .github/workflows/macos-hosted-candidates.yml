name: macOS hosted candidates
run-name: Bounded Mac volume experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  volume-experiment:
    name: Fresh Mac volume experiment
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Require an exact supported Apple Silicon host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(uname -r)" = 24.6.0
          case "$(sw_vers -buildVersion)" in 24G830|24H232) ;; *) exit 1 ;; esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Measure fresh fixed-volume creation and attachment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JIG_VOLUME_EXPERIMENT'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { mkdtemp, mkdir, realpath, stat, statfs, writeFile, readFile, rm, chmod, lstat, open } from 'node:fs/promises'
          import { join } from 'node:path'
          import { performance } from 'node:perf_hooks'
          
          assert.equal(process.platform, 'darwin')
          assert.equal(process.arch, 'arm64')
          const sizes = [16 * 1024 * 1024, 512 * 1024 * 1024]
          const work = await realpath(await mkdtemp(join(process.env.RUNNER_TEMP, 'jig-volume-benchmark-')))
          await chmod(work, 0o700)
          const deadline = performance.now() + 6 * 60_000
          let cleaning = false
          const tool = (path, args, input) => {
            const remaining = deadline + (cleaning ? 60_000 : 0) - performance.now()
            if (remaining <= 0) throw new Error('Benchmark command deadline expired')
            return execFileSync(path, args, {
            cwd: '/', env: { PATH: '/usr/bin:/bin', LC_ALL: 'C' }, input,
            timeout: Math.max(1, Math.floor(Math.min(30_000, remaining))), killSignal: 'SIGKILL', maxBuffer: 1024 * 1024,
            })
          }
          const plist = (data) => JSON.parse(tool('/usr/bin/plutil', ['-convert', 'json', '-o', '-', '-'], data))
          const variants = [
            { name: 'current', create: [], attach: [] },
            { name: 'attach-noverify', create: [], attach: ['-noverify'] },
            { name: 'small-initial-metadata', create: ['-fsargs', '-c c=1,e=1,a=1,b=1'], attach: [] },
          ]
          const imageInventory = () => plist(tool('/usr/bin/hdiutil', ['info', '-plist'])).images
          const mappedImage = async (image, backing, bytes) => {
            const candidates = imageInventory().filter(entry => entry['image-path'] === image)
            assert(candidates.length <= 1)
            if (!candidates.length) return undefined
            const observed = await lstat(image, { bigint: true })
            assert(observed.isFile() && observed.nlink === 1n && observed.dev === backing.dev && observed.ino === backing.ino)
            const record = candidates[0]
            assert.equal(record['owner-uid'], process.getuid())
            assert.equal(record.blocksize, 512)
            assert.equal(record.blockcount, bytes / 512)
            assert.equal(record['image-encrypted'], false)
            assert.equal(record['system-entities'].length, 1)
            const device = record['system-entities'][0]['dev-entry']
            assert(/^\/dev\/disk[1-9][0-9]{0,5}$/.test(device))
            return device
          }
          console.log(JSON.stringify({kind:'metadata', sourceRevision:process.env.GITHUB_SHA, build:tool('/usr/bin/sw_vers',['-buildVersion']).toString().trim(), sizes, rounds:5}))
          const trials = []
          const refused = new Set()
          let complete = false
          try {
            for (const bytes of sizes) {
            for (let round = 0; round < 5; round++) {
              for (const variant of variants) {
                if (refused.has(`${bytes}:${variant.name}`)) continue
                const root = join(work, `${bytes}-${round}-${variant.name}`)
                const mount = join(root, 'mount')
                const image = join(root, 'volume.dmg')
                await mkdir(root, { mode: 0o700 })
                await mkdir(mount, { mode: 0o700 })
                let backing
                let phase = 'create'
                try {
                  const begin = performance.now()
                  tool('/usr/bin/hdiutil', ['create', '-sectors', String(bytes / 512), '-fs',
                    'Case-sensitive HFS+', '-volname', `Jig-${round}-${variant.name}`, '-type', 'UDIF',
                    '-layout', 'NONE', '-nospotlight', ...variant.create, image])
                  const handle = await open(image, 'r+')
                  try { await handle.chmod(0o600); await handle.truncate(bytes); await handle.sync() } finally { await handle.close() }
                  const created = performance.now()
                  backing = await lstat(image, { bigint: true })
                  assert.equal(backing.size, BigInt(bytes))
                  assert.equal(backing.nlink, 1n)
                  assert.equal(backing.uid, BigInt(process.getuid()))
                  phase = 'attach'
                  const attached = plist(tool('/usr/bin/hdiutil', ['attach', '-kernel', '-nobrowse',
                    '-noautoopen', '-noautofsck', '-owners', 'on', '-mountpoint', mount, '-mount',
                    'required', '-plist', ...variant.attach, image]))
                  const mounted = performance.now()
                  const entities = attached['system-entities']
                  assert(Array.isArray(entities))
                  const volume = entities.find(entry => entry['mount-point'] === mount)
                  assert(volume && volume['volume-kind'] === 'hfs')
                  const device = await mappedImage(image, backing, bytes)
                  assert.equal(device, volume['dev-entry'])
                  phase = 'validate'
                  const filesystem = await statfs(mount, { bigint: true })
                  const capacity = filesystem.bsize * filesystem.blocks
                  assert(capacity > 0n && capacity <= BigInt(bytes))
                  assert.equal((await stat(mount)).uid, process.getuid())
                  await writeFile(join(mount, 'A'), 'upper', { flag: 'wx', mode: 0o600 })
                  await assert.rejects(readFile(join(mount, 'a')), { code: 'ENOENT' })
                  await writeFile(join(mount, 'a'), 'lower', { flag: 'wx', mode: 0o600 })
                  assert.equal(await readFile(join(mount, 'A'), 'utf8'), 'upper')
                  assert.equal(await readFile(join(mount, 'a'), 'utf8'), 'lower')
                  phase = 'detach'
                  tool('/usr/bin/hdiutil', ['detach', device])
                  const detached = performance.now()
                  assert.equal(await mappedImage(image, backing, bytes), undefined)
                  const record = { variant: variant.name, round, bytes, status: 'passed', createMs: created - begin,
                    attachMs: mounted - created, verifiedDetachMs: detached - mounted,
                    totalMs: detached - begin, capacityBytes: String(capacity) }
                  trials.push(record)
                  console.log(JSON.stringify(record))
                } catch (error) {
                  if (variant.name === 'current') throw error
                  refused.add(`${bytes}:${variant.name}`)
                  const record = { variant: variant.name, round, bytes, status:'failed', phase,
                    exitCode:Number.isInteger(error.status) ? error.status : null }
                  trials.push(record)
                  console.log(JSON.stringify(record))
                } finally {
                  cleaning = true
                  // A successful attach can precede malformed command output. Derive
                  // cleanup authority from its live exact image mapping, never a saved disk.
                  if (!backing) {
                    // Failed creation can still leave image-tool state. Unknown backing
                    // has no detach authority and prevents recursive directory removal.
                    assert(!imageInventory().some(entry => entry['image-path'] === image),
                      'Failed creation left an unverified mounted image; retain evidence')
                  }
                  if (backing) {
                    const device = await mappedImage(image, backing, bytes)
                    if (device) tool('/usr/bin/hdiutil', ['detach', device])
                    assert.equal(await mappedImage(image, backing, bytes), undefined)
                  }
                  await rm(root, { recursive: true })
                  cleaning = false
                }
              }
            }
            }
            complete = true
            console.log(JSON.stringify({ kind: 'summary', trials }))
          } finally {
            if (complete) await rm(work, { recursive: true })
            else console.error('Failed experiment retained at', work)
          }
          
          JIG_VOLUME_EXPERIMENT
          
