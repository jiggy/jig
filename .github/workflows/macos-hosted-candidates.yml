# Complete host qualification within the established PR scope; final checks always report.
name: "macOS hosted candidates"
"on":
  pull_request: null
  workflow_dispatch:
    inputs:
      include_startup_profile:
        description: "Profile installed startup on Apple Silicon (optional, up to 30 minutes)"
        type: "boolean"
        default: false
  push:
    branches:
      - "main"
permissions:
  contents: "read"
concurrency:
  group: "macos-hosted-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}"
  cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}"
jobs:
  scope:
    name: "Determine macos host scope"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    outputs:
      required: "${{ steps.scope.outputs.required }}"
      native_lane: "${{ steps.native-lane.outputs.lane }}"
      workers: "${{ steps.plan.outputs.workers }}"
      shard_count: "${{ steps.plan.outputs.shard_count }}"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        name: "Determine whether complete host qualification is required"
        id: "scope"
        run: 'node scripts/ci/host-scope.mjs --scope macos --github-output "$GITHUB_OUTPUT"'
      -
        name: "Select the complete host execution plan"
        id: "plan"
        run: "node scripts/ci/macos-host-cohort-run.mjs plan"
      -
        name: "Select a bounded main native lane"
        id: "native-lane"
        if: "github.ref == 'refs/heads/main'"
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync } from 'node:fs'
          const number = process.env.GITHUB_RUN_NUMBER
          if (!/^[1-9][0-9]*$/.test(number ?? '')) throw Error('Missing exact workflow run number')
          appendFileSync(process.env.GITHUB_OUTPUT, `lane=${BigInt(number) % 2n}\n`)
          JS
  cohort-allocator:
    name: "Allocate exact-profile Mac roles"
    needs: "scope"
    if: "${{ needs.scope.outputs.required == 'true' }}"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 90
    permissions:
      contents: "read"
      actions: "read"
    steps:
      -
        name: "Keep complete-host allocation unchanged"
        if: "github.event_name != 'pull_request'"
        run: "echo 'Main and manual runs use one complete Apple Silicon host.'"
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        if: "github.event_name == 'pull_request'"
        with:
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        if: "github.event_name == 'pull_request'"
        with:
          node-version: "24"
      -
        name: "Bind the current allocator to its 90-minute coordination allowance"
        if: "github.event_name == 'pull_request'"
        env:
          GH_TOKEN: "${{ github.token }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          node scripts/ci/pr-time-budget.mjs start --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$PR_HEAD_SHA" --kind coordination \
            --job-name "Allocate exact-profile Mac roles" --github-env "$GITHUB_ENV"
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        if: "github.event_name == 'pull_request'"
        with:
          bun-version: "1.4.2"
      -
        name: "Install the pinned official artifact client in isolated scratch"
        if: "github.event_name == 'pull_request'"
        timeout-minutes: 2
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/mac-cohort-client"
          cp scripts/ci/mac-cohort-client/package.json scripts/ci/mac-cohort-client/bun.lock "$RUNNER_TEMP/mac-cohort-client/"
          node scripts/ci/pr-time-budget.mjs run -- bun install --cwd "$RUNNER_TEMP/mac-cohort-client" --frozen-lockfile --ignore-scripts
      -
        name: "Announce readiness and assign each worker exactly once"
        if: "github.event_name == 'pull_request'"
        uses: "actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd"
        env:
          GH_TOKEN: "${{ github.token }}"
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            execFileSync('node', ['scripts/ci/pr-time-budget.mjs', 'run', '--',
              'node', 'scripts/ci/macos-host-cohort-run.mjs', 'allocate'], {
              stdio: 'inherit', env: process.env,
            });
      -
        name: "Require completion within the allocator coordination allowance"
        if: "github.event_name == 'pull_request'"
        run: "node scripts/ci/pr-time-budget.mjs check"
  host-artifacts:
    name: "Prepare Mac inputs and confirm allocator readiness"
    needs: "scope"
    if: "${{ needs.scope.outputs.required == 'true' }}"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    outputs:
      artifact_id: "${{ steps.prepared-artifacts.outputs.artifact-id }}"
    permissions:
      contents: "read"
      actions: "read"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        name: "Bind the current preparation job to its 45-minute allowance"
        if: "github.event_name == 'pull_request'"
        env:
          GH_TOKEN: "${{ github.token }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          node scripts/ci/pr-time-budget.mjs start --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$PR_HEAD_SHA" --kind preparation \
            --job-name "Prepare Mac inputs and confirm allocator readiness" --github-env "$GITHUB_ENV"
      -
        name: "Reserve time for evidence and final checks"
        id: "acquire-budget"
        if: "github.event_name == 'pull_request'"
        run: 'node scripts/ci/pr-time-budget.mjs remaining --github-output "$GITHUB_OUTPUT"'
      -
        name: "Acquire the exact canonical CI candidates"
        timeout-minutes: "${{ github.event_name == 'pull_request' && fromJSON(steps.acquire-budget.outputs.step_timeout_minutes) || 45 }}"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -eu
          node scripts/ci/pr-time-budget.mjs run -- node scripts/ci/candidate-transfer.mjs acquire "$RUNNER_TEMP/macos-host-artifacts" --source "$GITHUB_SHA" --after-quick true --producer-timeout-seconds 1800 --timeout-seconds 600
      -
        name: "Retain exact macos host artifacts"
        id: "prepared-artifacts"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "macos-host-artifacts-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/macos-host-artifacts"
          retention-days: 7
          if-no-files-found: "error"
      -
        name: "Reserve time to wait for allocator readiness"
        id: "ready-budget"
        if: "github.event_name == 'pull_request'"
        run: 'node scripts/ci/pr-time-budget.mjs remaining --github-output "$GITHUB_OUTPUT"'
      -
        name: "Verify the allocator is ready before requesting Mac runners"
        if: "github.event_name == 'pull_request'"
        timeout-minutes: "${{ fromJSON(steps.ready-budget.outputs.step_timeout_minutes) }}"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "node scripts/ci/pr-time-budget.mjs run -- node scripts/ci/macos-host-cohort-run.mjs ready"
      -
        name: "Require completion within the preparation allowance"
        if: "github.event_name == 'pull_request'"
        run: "node scripts/ci/pr-time-budget.mjs check"
  prerequisites:
    name: "${{ matrix.guard && 'Enforce Mac PR deadline' || (github.event_name == 'pull_request' && format('Native host worker — {0} / {1}', matrix.arch, matrix.worker) || format('Native host shard — {0} / 0', matrix.arch)) }}"
    runs-on: "${{ matrix.guard && 'ubuntu-24.04' || 'macos-15' }}"
    concurrency:
      group: "macos-hosted-native-${{ github.ref == 'refs/heads/main' && format('main-{0}', needs.scope.outputs.native_lane) || format('{0}-{1}', github.run_id, matrix.worker) }}"
      queue: "max"
      cancel-in-progress: false
    # Admit Macs only after canonical inputs and Quick checks are ready on Ubuntu.
    # Each assigned Mac has 25 minutes of execution; queue time is reported separately.
    # The Ubuntu monitor bounds queues/coordination and cancels failed matrix siblings.
    # Main and manual runs retain one complete host and their existing allowance.
    timeout-minutes: "${{ github.event_name == 'pull_request' && (matrix.guard && 90 || 25) || (inputs.include_startup_profile && 90 || 60) }}"
    permissions:
      contents: "read"
      actions: "read"
    env:
      JIG_MACOS_TEST_PLAN: "${{ github.event_name == 'pull_request' && 'pull-request' || 'complete' }}"
    strategy:
      fail-fast: "${{ github.event_name == 'pull_request' }}"
      max-parallel: 6
      matrix: "${{ fromJSON(needs.scope.outputs.workers) }}"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        name: "Bind the assigned job to its execution or coordination allowance"
        if: "github.event_name == 'pull_request'"
        env:
          GH_TOKEN: "${{ github.token }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          PR_BUDGET_KIND: "${{ matrix.guard && 'coordination' || 'worker' }}"
          PR_BUDGET_JOB_NAME: "${{ matrix.guard && 'Enforce Mac PR deadline' || format('Native host worker — {0} / {1}', matrix.arch, matrix.worker) }}"
        run: |
          node scripts/ci/pr-time-budget.mjs start --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$PR_HEAD_SHA" --kind "$PR_BUDGET_KIND" \
            --job-name "$PR_BUDGET_JOB_NAME" --github-env "$GITHUB_ENV"
      -
        name: "Monitor Mac queues and enforce each worker's 25-minute execution limit"
        if: "matrix.guard"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "node scripts/ci/pr-time-budget.mjs guard-matrix"
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        if: "${{ !matrix.guard }}"
        with:
          bun-version: "1.4.2"
      -
        uses: "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        if: "${{ !matrix.guard }}"
        with:
          just-version: "1.43.1"
      -
        name: "Record exact host and verify native process prerequisites"
        if: "${{ !matrix.guard }}"
        env:
          EXPECTED_ARCH: "${{ matrix.arch }}"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/mac-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/mac-evidence/source.txt"
          uname -a > "$RUNNER_TEMP/mac-evidence/host.txt"
          sw_vers >> "$RUNNER_TEMP/mac-evidence/host.txt"
          xcrun --show-sdk-version >> "$RUNNER_TEMP/mac-evidence/host.txt"
          bun -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw Error("incorrect native architecture")'
          node scripts/ci/pr-time-budget.mjs run -- bun scripts/ci/probe-macos-host.ts --hosted | tee "$RUNNER_TEMP/mac-evidence/prerequisites.json"
      -
        name: "Install the pinned official artifact client in isolated scratch"
        if: "${{ !matrix.guard && github.event_name == 'pull_request' }}"
        timeout-minutes: 2
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/mac-cohort-client"
          cp scripts/ci/mac-cohort-client/package.json scripts/ci/mac-cohort-client/bun.lock "$RUNNER_TEMP/mac-cohort-client/"
          node scripts/ci/pr-time-budget.mjs run -- bun install --cwd "$RUNNER_TEMP/mac-cohort-client" --frozen-lockfile --ignore-scripts
      -
        name: "Announce this exact host and await its assigned role"
        if: "${{ !matrix.guard }}"
        id: "role"
        timeout-minutes: 3
        uses: "actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd"
        env:
          MAC_HOST_WORKER: "${{ matrix.worker }}"
          GH_TOKEN: "${{ github.token }}"
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            execFileSync('node', ['scripts/ci/pr-time-budget.mjs', 'run', '--',
              'node', 'scripts/ci/macos-host-cohort-run.mjs', 'claim'], {
              stdio: 'inherit', env: process.env,
            });
      -
        name: "Compile the native launcher and validate SDK descriptor layouts"
        if: "${{ !matrix.guard && steps.role.outputs.execute == 'true' }}"
        run: |
          set -o pipefail
          node scripts/ci/pr-time-budget.mjs run -- clang -Wall -Wextra -Werror -Wno-deprecated-declarations packages/jig/support/macos-exec.c -o "$RUNNER_TEMP/mac-evidence/macos-exec"
          node scripts/ci/pr-time-budget.mjs run -- clang -Wall -Wextra -Werror packages/jig/test/fixtures/macos-file-abi.c -o "$RUNNER_TEMP/mac-evidence/file-abi"
          "$RUNNER_TEMP/mac-evidence/file-abi" | tee "$RUNNER_TEMP/mac-evidence/file-abi.txt"
          file "$RUNNER_TEMP/mac-evidence/macos-exec" >> "$RUNNER_TEMP/mac-evidence/host.txt"
      -
        name: "Install build dependencies without lifecycle scripts"
        if: "${{ !matrix.guard && steps.role.outputs.execute == 'true' }}"
        run: "node scripts/ci/pr-time-budget.mjs run -- bun install --ignore-scripts"
      -
        name: "Build the source-test workspace packages"
        if: "${{ !matrix.guard && steps.role.outputs.execute == 'true' }}"
        run: "node scripts/ci/pr-time-budget.mjs run -- just --justfile packages/jig/justfile build"
      -
        name: "Prepare genuine pinned clients for offline startup and refusal checks"
        if: "${{ !matrix.guard && steps.role.outputs.installed == 'true' }}"
        timeout-minutes: "${{ github.event_name == 'pull_request' && 3 || 60 }}"
        run: "node scripts/ci/pr-time-budget.mjs run -- bun scripts/ci/install-macos-test-clients.ts \"$RUNNER_TEMP/jig-native-clients\" >> \"$GITHUB_ENV\""
      -
        name: "Download the prepared canonical Mac inputs"
        if: "${{ !matrix.guard && steps.role.outputs.execute == 'true' }}"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        timeout-minutes: "${{ github.event_name == 'pull_request' && 2 || 10 }}"
        with:
          artifact-ids: "${{ needs.host-artifacts.outputs.artifact_id }}"
          merge-multiple: true
          path: "${{ runner.temp }}/macos-host-artifacts"
      -
        name: "Verify exact canonical publication archives"
        if: "${{ !matrix.guard && steps.role.outputs.execute == 'true' }}"
        run: |
          set -eu
          node scripts/ci/candidate-provenance.mjs verify "$RUNNER_TEMP/macos-host-artifacts" --source "$GITHUB_SHA"
          printf 'JIG_CI_CANDIDATE_DIRECTORY=%s\n' "$RUNNER_TEMP/macos-host-artifacts" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/macos-host-artifacts/CANDIDATE.json" "$RUNNER_TEMP/mac-evidence/CANDIDATE.json"
          cp "$RUNNER_TEMP/macos-host-artifacts/ARTIFACT.json" "$RUNNER_TEMP/mac-evidence/ARTIFACT.json"
      -
        name: "Reserve time for evidence and final checks"
        id: "native-budget"
        if: "${{ !matrix.guard && github.event_name == 'pull_request' && steps.role.outputs.role == '0' }}"
        run: 'node scripts/ci/pr-time-budget.mjs remaining --github-output "$GITHUB_OUTPUT"'
      -
        name: "Test native containment and recovery"
        if: "${{ !matrix.guard && steps.role.outputs.execute == 'true' && steps.role.outputs.role == '0' }}"
        timeout-minutes: "${{ github.event_name == 'pull_request' && fromJSON(steps.native-budget.outputs.step_timeout_minutes) || 60 }}"
        env:
          JIG_MACOS_PROCESS_TEST: "1"
        run: |
          set -o pipefail
          snapshot() {
            { launchctl list | awk 'NR > 1 && $3 ~ /^org\.jig\./ {print "job " $3}'; mount | awk '/jig-| on \/Volumes\/Jig-/ {print "mount " $0}'; } | LC_ALL=C sort
          }
          snapshot > "$RUNNER_TEMP/mac-evidence/before-native.txt"
          status=0
          node scripts/ci/pr-time-budget.mjs run -- bun test packages/jig/test/macos/macos-process-controls.test.ts packages/jig/test/macos/macos-execution.test.ts packages/jig/test/macos/macos-descriptor-files.test.ts packages/jig/test/macos/macos-descriptor-handoff.test.ts packages/jig/test/macos/macos-volume.test.ts packages/jig/test/macos/macos-backend-state.test.ts packages/jig/test/macos/macos-native-backend.test.ts packages/jig/test/macos/macos-guardian.test.ts --bail=1 --timeout 420000 --reporter=junit --reporter-outfile="$RUNNER_TEMP/mac-evidence/native-tests.xml" 2>&1 | tee "$RUNNER_TEMP/mac-evidence/native-tests.txt" || status=$?
          snapshot > "$RUNNER_TEMP/mac-evidence/after-native.txt"
          diff -u "$RUNNER_TEMP/mac-evidence/before-native.txt" "$RUNNER_TEMP/mac-evidence/after-native.txt" || status=1
          exit "$status"
      -
        name: "Reserve time for evidence and final checks"
        id: "qualify-budget"
        if: "${{ !matrix.guard && github.event_name == 'pull_request' && steps.role.outputs.execute == 'true' }}"
        run: 'node scripts/ci/pr-time-budget.mjs remaining --github-output "$GITHUB_OUTPUT"'
      -
        name: "${{ github.event_name == 'pull_request' && 'Run the assigned host test role' || 'Qualify the complete rootless host and installed consumer' }}"
        if: "${{ !matrix.guard && steps.role.outputs.execute == 'true' }}"
        timeout-minutes: "${{ github.event_name == 'pull_request' && fromJSON(steps.qualify-budget.outputs.step_timeout_minutes) || (inputs.include_startup_profile && 90 || 60) }}"
        env:
          MAC_HOST_ROLE: "${{ steps.role.outputs.role }}"
          JIG_MACOS_TEST_TIMINGS_DIRECTORY: "${{ runner.temp }}/mac-evidence"
          JIG_STARTUP_PROFILE_DIRECTORY: "${{ steps.role.outputs.installed == 'true' && inputs.include_startup_profile && format('{0}/mac-startup-profile', runner.temp) || '' }}"
        run: |
          set -o pipefail
          node scripts/ci/pr-time-budget.mjs run -- scripts/ci/qualify-macos-host.sh --shard "$MAC_HOST_ROLE" 2>&1 | tee "$RUNNER_TEMP/mac-evidence/host-conformance.txt"
      -
        name: "Verify canonical candidate metadata is unchanged"
        if: "${{ always() && !matrix.guard && steps.role.outputs.execute == 'true' }}"
        run: |
          set -eu
          node scripts/ci/candidate-provenance.mjs verify "$RUNNER_TEMP/macos-host-artifacts" --source "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/mac-evidence/CANDIDATE.json" "$RUNNER_TEMP/macos-host-artifacts/CANDIDATE.json"
          cmp "$RUNNER_TEMP/mac-evidence/ARTIFACT.json" "$RUNNER_TEMP/macos-host-artifacts/ARTIFACT.json"
      -
        name: "Record successful shard"
        if: "${{ !matrix.guard && steps.role.outputs.execute == 'true' }}"
        env:
          MAC_HOST_ROLE: "${{ steps.role.outputs.role }}"
          EXPECTED_ARCH: "${{ matrix.arch }}"
        run: |
          printf '%s %s %s\n' "$GITHUB_SHA" "$EXPECTED_ARCH" "$MAC_HOST_ROLE" > "$RUNNER_TEMP/mac-evidence/shard-$MAC_HOST_ROLE.complete"
      -
        name: "Retain candidate prerequisite evidence"
        if: "${{ always() && !matrix.guard }}"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "${{ github.event_name == 'pull_request' && format('macos-cohort-worker-{0}-{1}-r{2}-a{3}', matrix.worker, github.sha, github.run_id, github.run_attempt) || format('macos-prerequisites-{0}-0-{1}-r{2}-a{3}', matrix.arch, github.sha, github.run_id, github.run_attempt) }}"
          path: |
            ${{ runner.temp }}/mac-evidence/*.txt
            ${{ runner.temp }}/mac-evidence/*.json
            ${{ runner.temp }}/mac-evidence/*.xml
            ${{ runner.temp }}/mac-evidence/*.complete
          retention-days: 7
      -
        name: "Retain optional installed startup profile"
        if: "${{ always() && !matrix.guard && steps.role.outputs.installed == 'true' && inputs.include_startup_profile }}"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "macos-startup-profile-${{ matrix.arch }}-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/mac-startup-profile"
          if-no-files-found: "ignore"
          retention-days: 7
      -
        name: "Require completion within this worker's 25-minute execution allowance"
        if: "${{ !matrix.guard && github.event_name == 'pull_request' }}"
        run: 'node scripts/ci/pr-time-budget.mjs check --github-summary "$GITHUB_STEP_SUMMARY"'
    needs:
      - "scope"
      - "host-artifacts"
    if: "${{ needs.scope.outputs.required == 'true' }}"
  qualified-architecture:
    name: "Native host qualification — ${{ matrix.arch }}"
    if: "${{ always() && needs.scope.result == 'success' && needs.scope.outputs.required == 'true' }}"
    needs:
      - "scope"
      - "host-artifacts"
      - "cohort-allocator"
      - "prerequisites"
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "read"
      actions: "read"
    timeout-minutes: 5
    env:
      JIG_MACOS_TEST_PLAN: "${{ github.event_name == 'pull_request' && 'pull-request' || 'complete' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            arch: "arm64"
            count: "${{ fromJSON(needs.scope.outputs.shard_count) }}"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        name: "Bind this qualification collector to its five-minute evidence allowance"
        if: "github.event_name == 'pull_request'"
        env:
          GH_TOKEN: "${{ github.token }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          node scripts/ci/pr-time-budget.mjs start --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$PR_HEAD_SHA" --kind evidence \
            --job-name "Native host qualification — ${{ matrix.arch }}" --github-env "$GITHUB_ENV"
      -
        name: "Download this architecture's shard evidence"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          pattern: "${{ github.event_name == 'pull_request' && format('macos-cohort-worker-*-{0}-r{1}-a{2}', github.sha, github.run_id, github.run_attempt) || format('macos-prerequisites-{0}-*-{1}-r{2}-a{3}', matrix.arch, github.sha, github.run_id, github.run_attempt) }}"
          path: "${{ github.event_name == 'pull_request' && format('{0}/macos-workers', runner.temp) || format('{0}/macos-evidence', runner.temp) }}"
      -
        name: "Read this attempt's job timing evidence"
        if: "github.event_name != 'pull_request'"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100' --jq '.jobs' > "$RUNNER_TEMP/mac-job-timings.json" || {
            rm -f "$RUNNER_TEMP/mac-job-timings.json"
            echo 'Job timing API unavailable; qualification still requires complete test evidence.'
          }
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "macos-host-artifacts-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/macos-host-artifacts"
      -
        name: "Validate every PR worker and select one complete exact profile"
        if: "github.event_name == 'pull_request'"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "node scripts/ci/pr-time-budget.mjs run --reserve-seconds 0 -- node scripts/ci/macos-host-cohort-run.mjs reconcile"
      -
        name: "Require complete exact-revision proof and summarize coverage"
        if: "always()"
        env:
          EXPECTED_ARCH: "${{ matrix.arch }}"
          EXPECTED_SHA: "${{ github.sha }}"
          SHARD_COUNT: "${{ matrix.count }}"
        run: |
          set -eu
          # PR directories are normalized only after every worker's proof validates.
          # Main/manual artifacts still have the fixed complete-host identity.
          python3 - <<'PY'
          import os
          from pathlib import Path
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              raise SystemExit(0)
          root = Path(os.environ["RUNNER_TEMP"]) / "macos-evidence"
          arch, sha, run, attempt = (os.environ[key] for key in ("EXPECTED_ARCH", "EXPECTED_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
          for shard in range(int(os.environ["SHARD_COUNT"])):
              original = root / f"macos-prerequisites-{arch}-{shard}-{sha}-r{run}-a{attempt}"
              normalized = root / f"macos-prerequisites-{arch}-{shard}-{sha}"
              if not original.is_dir() or original.is_symlink() or normalized.exists():
                  raise ValueError("missing or stale current-attempt Mac shard evidence")
              original.rename(normalized)
          PY
          node --input-type=module - <<'JS'
          import { readFile } from "node:fs/promises"
          import { join } from "node:path"
          import { candidateBinding, verifyCandidateBundle } from "./scripts/ci/candidate-provenance.mjs"
          const root = process.env.RUNNER_TEMP
          const bundle = join(root, "macos-host-artifacts")
          const receipt = await verifyCandidateBundle(bundle, { sourceRevision: process.env.EXPECTED_SHA })
          candidateBinding(receipt, JSON.parse(await readFile(join(bundle, "ARTIFACT.json"), "utf8")))
          for (let shard = 0; shard < Number(process.env.SHARD_COUNT); shard++) {
            const directory = join(root, "macos-evidence", `macos-prerequisites-${process.env.EXPECTED_ARCH}-${shard}-${process.env.EXPECTED_SHA}`)
            for (const filename of ["CANDIDATE.json", "ARTIFACT.json"]) {
              if (!(await readFile(join(directory, filename))).equals(await readFile(join(bundle, filename)))) throw Error("Mac shard used a different canonical candidate")
            }
          }
          JS
          python3 scripts/ci/macos-host-summary.py "$EXPECTED_ARCH" "$EXPECTED_SHA" "$SHARD_COUNT" \
            "$RUNNER_TEMP/macos-evidence" "$RUNNER_TEMP/mac-job-timings.json" \
            "$RUNNER_TEMP/mac-summary.json" >> "$GITHUB_STEP_SUMMARY"
      -
        name: "Retain coverage and timing summary"
        if: "always()"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "macos-summary-${{ matrix.arch }}-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: |
            ${{ runner.temp }}/mac-summary.json
            ${{ runner.temp }}/mac-cohort.json
          if-no-files-found: "ignore"
          retention-days: 7
      -
        name: "Require completion within the evidence collection allowance"
        if: "github.event_name == 'pull_request'"
        run: "node scripts/ci/pr-time-budget.mjs check"
      -
        name: "Bind complete native qualification to the canonical candidate"
        env:
          ARCHITECTURE: "${{ matrix.arch }}"
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/macos-qualification"
          node scripts/ci/job-evidence.mjs --id "macos-$ARCHITECTURE" --summary "$RUNNER_TEMP/mac-summary.json" --artifacts --residue --output "$RUNNER_TEMP/macos-observed.json"
          node scripts/ci/candidate-provenance.mjs qualification "$RUNNER_TEMP/macos-host-artifacts" "$RUNNER_TEMP/macos-qualification/QUALIFICATION.json" --kind macos --profile "$ARCHITECTURE"
          cp "$RUNNER_TEMP/mac-summary.json" "$RUNNER_TEMP/macos-qualification/mac-summary.json"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "macos-qualification-${{ matrix.arch }}-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/macos-qualification"
          retention-days: 7
          if-no-files-found: "error"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "macos-observed-${{ matrix.arch }}-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/macos-observed.json"
          retention-days: 7
          if-no-files-found: "error"
      -
        name: "Require completion within the evidence collection allowance"
        if: "github.event_name == 'pull_request'"
        run: "node scripts/ci/pr-time-budget.mjs check"
  affected-macos:
    name: "affected-macos"
    permissions:
      contents: "read"
      actions: "read"
    if: "always()"
    needs:
      - "scope"
      - "host-artifacts"
      - "cohort-allocator"
      - "prerequisites"
      - "qualified-architecture"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        name: "Bind this final gate to its five-minute evidence allowance"
        if: "github.event_name == 'pull_request'"
        env:
          GH_TOKEN: "${{ github.token }}"
          PR_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          node scripts/ci/pr-time-budget.mjs start --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$PR_HEAD_SHA" --kind evidence \
            --job-name "affected-macos" --github-env "$GITHUB_ENV"
      -
        name: "Revalidate host scope and every required job result"
        env:
          JOB_RESULTS: "${{ toJSON(needs) }}"
        run: |
          set -eu
          node -e 'const fs=require("node:fs"),jobs=JSON.parse(process.env.JOB_RESULTS);fs.writeFileSync(process.argv[1],JSON.stringify(Object.fromEntries(Object.entries(jobs).map(([id,job])=>[id,job.result]))));' "$RUNNER_TEMP/host-job-results.json"
          node scripts/ci/host-scope.mjs --scope macos --results "$RUNNER_TEMP/host-job-results.json" > "$RUNNER_TEMP/affected-report.json"
      -
        name: "Download complete observed execution evidence"
        if: "${{ needs.scope.outputs.required == 'true' }}"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          pattern: "macos-observed-*-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/observed-evidence"
          merge-multiple: false
      -
        name: "Require complete observed host qualification"
        if: "${{ needs.scope.outputs.required == 'true' }}"
        env:
          JOB_RESULTS: "${{ toJSON(needs) }}"
        run: |
          set -eu
          node -e 'const fs=require("node:fs"),jobs=JSON.parse(process.env.JOB_RESULTS);fs.writeFileSync(process.argv[1],JSON.stringify({"macos-arm64":jobs["qualified-architecture"].result}));' "$RUNNER_TEMP/host-evidence-results.json"
          node scripts/ci/job-evidence.mjs --directory "$RUNNER_TEMP/observed-evidence" --results "$RUNNER_TEMP/host-evidence-results.json" --scope macos --output "$RUNNER_TEMP/host-evidence.json"
      -
        name: "Retain host scope and complete qualification reconciliation"
        if: "always()"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "macos-affected-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: |
            ${{ runner.temp }}/affected-report.json
            ${{ runner.temp }}/host-evidence.json
          retention-days: 7
          if-no-files-found: "ignore"
      -
        name: "Report turnaround and require completion within the final gate allowance"
        if: "github.event_name == 'pull_request'"
        run: 'node scripts/ci/pr-time-budget.mjs check --github-summary "$GITHUB_STEP_SUMMARY"'
