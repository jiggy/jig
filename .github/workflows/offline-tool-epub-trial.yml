name: Offline Tool EPUB preview trial
on:
  push:
    branches:
      - trial/offline-tool-epub-preview
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Check out the trial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: "1.43.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: "1.4.4"
      - name: Install and verify Nix 2.34.9 in the disposable runner
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/nix-install"
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 \
            https://releases.nixos.org/nix/nix-2.34.9/install --output "$installer"
          printf '%s  %s\n' a03ce2e9eaf4ea1560260b9a93e311dbaf589d28fb5c9318f8d9e768ee6339d8 "$installer" |
            sha256sum --check --strict
          sh "$installer" --daemon --yes --no-channel-add
          export NIX_REMOTE=daemon
          nix=/nix/var/nix/profiles/default/bin
          test "$("$nix/nix" --version)" = 'nix (Nix) 2.34.9'
          java=/nix/store/3015h4ym2jc82lxxd7ffink77cfm18dc-openjdk-minimal-jre-21.0.13.1+2
          chrome=/nix/store/7ahd1k1nlgv5brqpmn5jdnk7c9wvl7ii-playwright-chromium-headless-shell
          fonts=/nix/store/9in52340xwg0r3h0dzm6w925ixl2rq54-dejavu-fonts-2.37
          "$nix/nix-store" --realise "$java" "$chrome" "$fonts"
          bundle="$RUNNER_TEMP/epubcheck-5.4.0.zip"
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip --output "$bundle"
          printf '%s  %s\n' 33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c "$bundle" | sha256sum --check --strict
          python3 -m zipfile -e "$bundle" "$RUNNER_TEMP"
          epubcheck=$("$nix/nix-store" --add-fixed sha256 --recursive "$RUNNER_TEMP/epubcheck-5.4.0")
          printf '%s\n' '<fontconfig>' "<dir>$fonts/share/fonts/truetype</dir>" \
            '<cachedir>/tmp/cache/fontconfig</cachedir><alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias></fontconfig>' \
            > "$RUNNER_TEMP/jig-epub-fonts.conf"
          fontconfig=$("$nix/nix-store" --add-fixed sha256 "$RUNNER_TEMP/jig-epub-fonts.conf")
          printf 'TRIAL_JAVA=%s\nTRIAL_CHROME=%s\nTRIAL_FONTS=%s\nTRIAL_EPUBCHECK=%s\nTRIAL_FONTCONFIG=%s\n' \
            "$java" "$chrome" "$fonts" "$epubcheck" "$fontconfig" >> "$GITHUB_ENV"
      - name: Provision the normal Linux containment host
        id: host
        env:
          JIG_CI_BUN: ${{ steps.bun.outputs.bun-path }}
        run: |
          scripts/ci/provision-github-rootless-host.sh provision
          printf 'JIG_CI_BUN=%s\n' "$JIG_CI_BUN" >> "$GITHUB_ENV"
      - name: Build Jig from the trial source
        run: |
          bun install --ignore-scripts --filter @jigging/jig --filter @jigging/agent-method --filter @jigging/agent-acp --filter @jigging/reporting --filter @jigging/display-model --filter @jigging/display-web --filter @jigging/display-tui
          just --justfile packages/jig/justfile build
      - name: Run EPUBCheck and Chromium through one reviewed Run
        run: |
          scripts/ci/provision-github-rootless-host.sh run-delegated env \
            "TRIAL_JAVA=$TRIAL_JAVA" "TRIAL_CHROME=$TRIAL_CHROME" "TRIAL_FONTS=$TRIAL_FONTS" \
            "TRIAL_EPUBCHECK=$TRIAL_EPUBCHECK" "TRIAL_FONTCONFIG=$TRIAL_FONTCONFIG" \
            "JIG_AUTHORING_NODE_PATH=$(command -v node)" \
            "$JIG_CI_BUN" test packages/jig/test/experimental/offline-tool-epub-preview.test.ts
      - name: Check for execution residue
        if: ${{ always() && steps.host.outcome == 'success' }}
        run: scripts/ci/provision-github-rootless-host.sh assert-clean
