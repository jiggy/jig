name: CI
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  candidate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install the pinned npm packer
        run: npm install --global npm@11.6.2
      - name: Freeze canonical packages before qualification
        run: node scripts/ci/build-candidates.mjs "$RUNNER_TEMP/candidates"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidates-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidates
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  quick-checks:
    name: Quick development checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - run: bun install --ignore-scripts
      - name: Check release intent and generated versions
        run: |
          release_base="$(node scripts/ci/release-base.mjs)"
          node scripts/release/cli.mjs check --base "$release_base"
      - name: Check development and release automation
        run: |
          set -o pipefail
          just test-tooling 2>&1 | tee "$RUNNER_TEMP/tooling.txt"
      - name: Record observed execution
        run: node scripts/ci/job-evidence.mjs --id quick-checks --output "$RUNNER_TEMP/evidence.json" --transcript "$RUNNER_TEMP/tooling.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-quick-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  sites:
    name: Build public sites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - run: bun install --cwd site --frozen-lockfile --ignore-scripts
      - name: Check documentation source and checker regressions
        env:
          DOCS_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bun test scripts/check-docs.test.ts
          bun scripts/check-docs.ts
      - name: Build Jig site
        env:
          DOCS_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir "$RUNNER_TEMP/sites"
          scripts/build-site.sh jig "$RUNNER_TEMP/sites/jig"
          bun scripts/check-docs.ts --sites "$RUNNER_TEMP/sites"
      - name: Record observed execution
        run: node scripts/ci/job-evidence.mjs --id sites --output "$RUNNER_TEMP/evidence.json" --pages "$RUNNER_TEMP/sites" --profiles jig
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-sites-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  python-build:
    name: Build Python reporting artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.3.0 twine==6.2.0 mypy==1.18.2
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - name: Build experimental Python reporting artifacts
        run: |
          python -m build --outdir "${{ runner.temp }}/python-reporting-dist" packages/jiggy-reporting
          python -m twine check --strict "${{ runner.temp }}"/python-reporting-dist/*
      - name: Freeze published Python FLOW dependency
        run: |-
          mkdir "$RUNNER_TEMP/python-dist"
          python -m pip download --no-deps jiggy-flow==0.1.0a7 --dest "$RUNNER_TEMP/python-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-dist
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-reporting-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-reporting-dist
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Check frozen Python distribution identities
        run: |
          mkdir "$RUNNER_TEMP/python-archives"
          cp "$RUNNER_TEMP"/python-dist/*.whl "$RUNNER_TEMP/python-archives/"
          cp "$RUNNER_TEMP"/python-reporting-dist/*.whl "$RUNNER_TEMP"/python-reporting-dist/*.tar.gz "$RUNNER_TEMP/python-archives/"
      - name: Record observed execution
        run: node scripts/ci/job-evidence.mjs --id python-build --output "$RUNNER_TEMP/evidence.json" --archives "$RUNNER_TEMP/python-archives" --profiles jiggy-reporting --artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-python-build-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  python-installed:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs:
      - python-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.14"
          - os: macos-14
            python: "3.14"
          - os: windows-2022
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: python-dist
      - run: python -m pip install mypy==1.18.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-reporting-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: python-reporting-dist
      - name: Test installed reporting wheel and sdist
        shell: bash
        run: |
          set -o pipefail
          python packages/jiggy-reporting/tests/package_smoke.py python-reporting-dist/*.whl python-reporting-dist/*.tar.gz python-dist/*.whl 2>&1 | tee -a "$RUNNER_TEMP/python-installed.txt"
      - name: Record observed execution
        run: node scripts/ci/job-evidence.mjs --id python-installed --output "$RUNNER_TEMP/evidence.json" --transcript "$RUNNER_TEMP/python-installed.txt" --artifacts --profile "${{ matrix.os }}/python-${{ matrix.python }}"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-python-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  source-tests:
    name: Source and package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install source dependencies
        run: |
          set -eu
          bun install --ignore-scripts
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0 mypy==1.18.2 jiggy-flow==0.1.0a7
      - name: Read the canonical npm bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/candidate-transfer.mjs acquire "$RUNNER_TEMP/candidates" --source "$GITHUB_SHA" --producer-run "$GITHUB_RUN_ID" --timeout-seconds 0
          printf 'CI_CANDIDATE_BUNDLE=%s\n' "$RUNNER_TEMP/candidates" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-reporting-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-reporting-dist
      - name: Run Jig source and package gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          JIG_CI_SOURCE_REPORT_DIRECTORY: ${{ runner.temp }}/source-reports
          CI_PYTHON_DISTRIBUTIONS: ${{ runner.temp }}/python-dist
          CI_PYTHON_REPORTING_DISTRIBUTIONS: ${{ runner.temp }}/python-reporting-dist
        run: |
          set -o pipefail
          FLOW_NODE=$(command -v node)
          PYTHON=$(command -v python)
          export FLOW_NODE PYTHON
          scripts/test-release.sh --profile portable-linux 2>&1 | tee "$RUNNER_TEMP/source-transcript.txt"
      - name: Record each completed source stage
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/source-evidence"
          node --input-type=module <<'JS'
          import { writeJobEvidence } from './scripts/ci/job-evidence.mjs'
          for (const id of ['source-portable', 'source-protocol', 'source-applications', 'source-python']) {
            const report = `${process.env.RUNNER_TEMP}/source-reports/${id}`
            await writeJobEvidence({
              id,
              output: `${process.env.RUNNER_TEMP}/source-evidence/${id}.json`,
              ...(id === 'source-python' ? { transcript: `${report}.txt` } : { junit: `${report}.xml` }),
            })
          }
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-source-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-evidence/*.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Retain source stage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-source-reports-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-reports
            ${{ runner.temp }}/source-transcript.txt
          retention-days: 7
          if-no-files-found: error
          overwrite: true
    needs:
      - candidate-build
      - python-build
    permissions:
      contents: read
      actions: read
  npm-candidate:
    name: Build ${{ matrix.package }} release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        package:
          - flow
          - agent
          - acp
          - jig
    env:
      RELEASE_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install the pinned npm qualifier
        run: npm install --global npm@11.6.2
      - name: Read the canonical candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/candidate-transfer.mjs acquire "$RUNNER_TEMP/candidates" --source "$GITHUB_SHA" --producer-run "$GITHUB_RUN_ID" --timeout-seconds 0
      - name: Install candidate qualification dependencies
        run: bun install --ignore-scripts
      - name: Qualify the frozen candidate
        run: |
          set -eu
          FLOW_NODE=$(command -v node)
          FLOW_NPM=$(command -v npm)
          JIG_NPM=$FLOW_NPM
          export FLOW_NODE FLOW_NPM JIG_NPM
          node scripts/ci/qualify-candidate.mjs "$RELEASE_PACKAGE" "$RUNNER_TEMP/candidates" "$RUNNER_TEMP/qualification.json"
          case "$RELEASE_PACKAGE" in flow) kind=flow-sdk;; agent) kind=agent-method;; acp) kind=agent-acp;; jig) kind=jig;; esac
          printf 'CANDIDATE_DIRECTORY=%s\n' "$RUNNER_TEMP/candidates/$kind" >> "$GITHUB_ENV"
          version=$(node -p 'require(process.env.RUNNER_TEMP+"/candidates/"+process.env.RELEASE_PACKAGE.replace("flow","flow-sdk").replace("agent","agent-method").replace("acp","agent-acp")+"/SUCCESS.json").version')
          printf 'artifact_name=npm-candidate-%s-%s-%s\n' "$RELEASE_PACKAGE" "$version" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        id: qualified
      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.qualified.outputs.artifact_name }}
          path: ${{ env.CANDIDATE_DIRECTORY }}
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Check immutable registry version before merge
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: node scripts/ci/npm-candidate-preflight.mjs "$CANDIDATE_DIRECTORY"
      - name: Record observed execution
        run: node scripts/ci/job-evidence.mjs --id npm-candidate --output "$RUNNER_TEMP/evidence.json" --qualification "$RUNNER_TEMP/qualification.json" --artifacts --profile "${{ matrix.package }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-npm-${{ matrix.package }}-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
    needs:
      - candidate-build
    permissions:
      contents: read
      actions: read
  test:
    if: always()
    needs:
      - quick-checks
      - sites
      - source-tests
      - candidate-build
      - python-build
      - python-installed
      - npm-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Download observed target evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-evidence-*-${{ github.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
      - name: Require successful jobs and complete execution evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          const jobs = JSON.parse(process.env.JOB_RESULTS)
          if (Object.values(jobs).some(job => job.result !== 'success'))
            throw new Error('Every CI job must succeed')
          const results = Object.fromEntries(Object.entries(jobs).map(([id, job]) => [id, job.result]))
          for (const id of ['source-portable', 'source-protocol', 'source-applications', 'source-python'])
            results[id] = jobs['source-tests'].result
          writeFileSync(`${process.env.RUNNER_TEMP}/results.json`, JSON.stringify(results))
          JS
          node scripts/ci/job-evidence.mjs --directory "$RUNNER_TEMP/evidence" --results "$RUNNER_TEMP/results.json" --scope ci --output "$RUNNER_TEMP/combined.json"
      - name: Retain complete execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-execution-evidence-${{ github.sha }}-a${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/results.json
            ${{ runner.temp }}/combined.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
