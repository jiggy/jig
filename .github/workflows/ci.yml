name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.43.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install workspace and fixture dependencies
        run: |
          bun install --ignore-scripts
          bun install --cwd conformance/run-1 --frozen-lockfile
          bun install --cwd site --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0 mypy==1.18.2

      - name: Build separate FLOW and Jig sites
        run: |
          scripts/build-site.sh flow "$RUNNER_TEMP/flow-site"
          scripts/build-site.sh jig "$RUNNER_TEMP/jig-site"

      - name: Run source, conformance, and package gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          FLOW_NODE=$(command -v node)
          PYTHON=$(command -v python)
          export FLOW_NODE PYTHON
          scripts/test-release.sh

      - name: Check development tooling
        run: just test-tooling

  python-build:
    name: Build Python SDK artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install build==1.3.0 twine==6.2.0 mypy==1.18.2
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: '1.43.1'
      - run: PYTHON=$(command -v python) just python::pack "${{ runner.temp }}/python-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-sdk-ci
          path: ${{ runner.temp }}/python-dist
          if-no-files-found: error

  python-installed:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: python-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: macos-14, python: '3.14'}
          - {os: windows-2022, python: '3.13'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-sdk-ci
          path: python-dist
      - run: python -m pip install mypy==1.18.2
      - name: Test installed wheel and sdist
        shell: bash
        run: python packages/flowmd-sdk/tests/package_smoke.py python-dist/*.whl python-dist/*.tar.gz
