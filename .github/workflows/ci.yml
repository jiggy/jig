name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.43.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install workspace and fixture dependencies
        run: |
          bun install --ignore-scripts
          bun install --cwd conformance/run-1 --frozen-lockfile
          bun install --cwd site --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check build==1.3.0

      - name: Build separate FLOW and Jig sites
        run: |
          scripts/build-site.sh flow "$RUNNER_TEMP/flow-site"
          scripts/build-site.sh jig "$RUNNER_TEMP/jig-site"

      - name: Run source, conformance, and package gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          FLOW_NODE=$(command -v node)
          PYTHON=$(command -v python)
          export FLOW_NODE PYTHON
          scripts/test-release.sh

      - name: Check development tooling
        run: just test-tooling
