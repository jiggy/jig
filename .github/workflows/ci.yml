name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.43.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      - name: Install workspace and fixture dependencies
        run: |
          bun install --ignore-scripts
          bun install --cwd conformance/run-0 --frozen-lockfile
          bun install --cwd site --frozen-lockfile --ignore-scripts
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0 mypy==1.18.2

      - name: Build separate FLOW and Jig sites
        run: |
          scripts/build-site.sh flow "$RUNNER_TEMP/flow-site"
          scripts/build-site.sh jig "$RUNNER_TEMP/jig-site"

      - name: Run source, conformance, and package gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          FLOW_NODE=$(command -v node)
          PYTHON=$(command -v python)
          export FLOW_NODE PYTHON
          scripts/test-release.sh

      - name: Check development tooling
        run: just test-tooling

  python-build:
    name: Build Python SDK artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install build==1.3.0 twine==6.2.0 mypy==1.18.2
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: '1.43.1'
      - run: PYTHON=$(command -v python) just python::candidate "${{ runner.temp }}/python-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/python-dist
          retention-days: 7
          if-no-files-found: error

  python-installed:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: python-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: macos-14, python: '3.14'}
          - {os: windows-2022, python: '3.13'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-candidate-${{ github.sha }}
          path: python-dist
      - run: python -m pip install mypy==1.18.2
      - name: Test installed wheel and sdist
        shell: bash
        run: python packages/jiggy-flow/tests/package_smoke.py python-dist/*.whl python-dist/*.tar.gz

  npm-candidate:
    name: Build ${{ matrix.package }} release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        package: [flow, agent, acp, jig]
    env:
      RELEASE_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Select and validate package
        id: selected
        run: |
          set -eu
          case $RELEASE_PACKAGE in
            flow)
              package_name=@jigging/flow
              manifest=packages/flow-sdk/package.json
              ;;
            jig)
              package_name=@jigging/jig
              manifest=packages/jig/package.json
              ;;
            agent)
              package_name=@jigging/agent-method
              manifest=packages/agent-method/package.json
              ;;
            acp)
              package_name=@jigging/agent-acp
              manifest=packages/agent-acp/package.json
              ;;
            *)
              echo "package must be flow, agent, acp or jig" >&2
              exit 1
              ;;
          esac
          PACKAGE_MANIFEST=$manifest EXPECTED_NAME=$package_name \
            node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const manifest = JSON.parse(await readFile(process.env.PACKAGE_MANIFEST, "utf8"));
          const prerelease = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|next)(?:\.[0-9A-Za-z-]+)*$/;
          if (manifest.name !== process.env.EXPECTED_NAME || !prerelease.test(manifest.version)) {
            throw new Error(`${process.env.PACKAGE_MANIFEST} must declare one exact alpha or next version for ${process.env.EXPECTED_NAME}`);
          }
          if (manifest.private === true) {
            throw new Error(`${manifest.name} is still private`);
          }
          if (manifest.publishConfig?.access !== "public") {
            throw new Error(`${manifest.name} must publish with public access`);
          }
          NODE
          version=$(PACKAGE_MANIFEST=$manifest node --input-type=module -e \
            'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.env.PACKAGE_MANIFEST, "utf8")).version)')
          artifact_name="npm-candidate-$RELEASE_PACKAGE-$version-${{ github.sha }}"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.43.1'

      - name: Install exact build tools
        run: |
          set -eu
          npm install --global npm@11.6.2
          npm install --global bun@1.3.3
          npm --version
          bun --version
          bun --revision

      - name: Provision Jig's disposable rootless host
        id: jig_host
        if: matrix.package == 'jig'
        run: |
          set -eu
          JIG_CI_BUN=$(readlink -f "$(command -v bun)")
          export JIG_CI_BUN
          scripts/ci/provision-github-rootless-host.sh provision
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Build and test exact candidate
        run: |
          set -eu
          if [ "$RELEASE_PACKAGE" = flow ]; then
            FLOW_NODE=$(command -v node)
            FLOW_NPM=$(command -v npm)
            export FLOW_NODE FLOW_NPM
            scripts/build-flow-sdk-candidate.sh "$RUNNER_TEMP/candidate"
          elif [ "$RELEASE_PACKAGE" = jig ]; then
            JIG_NPM=$(command -v npm)
            export JIG_NPM
            scripts/build-jig-candidate.sh "$RUNNER_TEMP/candidate"
          else
            FLOW_NODE=$(command -v node)
            FLOW_NPM=$(command -v npm)
            export FLOW_NODE FLOW_NPM
            agent_package=agent-method
            if [ "$RELEASE_PACKAGE" = acp ]; then agent_package=agent-acp; fi
            just agent-candidate "$agent_package" "$RUNNER_TEMP/candidate"
          fi

      - name: Require zero Jig host residue
        if: always() && steps.jig_host.outputs.ready == 'true'
        run: scripts/ci/provision-github-rootless-host.sh assert-clean

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.selected.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7
