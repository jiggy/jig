# Plan in shadow mode until same-revision audits support each exclusion class.
name: "CI"
"on":
  pull_request: null
  push:
    branches:
      - "main"
  workflow_dispatch: null
  schedule:
    - cron: "11 3 * * 0"
permissions:
  contents: "read"
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  plan:
    name: "Plan affected work"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    outputs:
      quick: "${{ steps.plan.outputs.quick }}"
      sites: "${{ steps.plan.outputs.sites }}"
      source: "${{ steps.plan.outputs.source }}"
      python: "${{ steps.plan.outputs.python }}"
      candidates: "${{ steps.plan.outputs.candidates }}"
      linux: "${{ steps.plan.outputs.linux }}"
      macos: "${{ steps.plan.outputs.macos }}"
      npm_matrix: "${{ steps.plan.outputs.npm_matrix }}"
      classification: "${{ steps.plan.outputs.classification }}"
      mode: "${{ steps.plan.outputs.mode }}"
      plan_digest: "${{ steps.plan.outputs.plan_digest }}"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        name: "Compute conservative dependency plan"
        id: "plan"
        env:
          BASE: "${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          MODE: "${{ vars.JIG_CI_SELECTION_MODE || 'shadow' }}"
          FORCE: "${{ vars.JIG_CI_FORCE_FULL || 'false' }}"
          PR_HEAD: "${{ github.event.pull_request.head.sha || '' }}"
        run: |
          set -eu
          set -- --head "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --mode "$MODE" --output "$RUNNER_TEMP/plan.json" --github-output "$GITHUB_OUTPUT"
          if [ -n "$BASE" ]; then set -- "$@" --base "$BASE"; fi
          if [ -n "$PR_HEAD" ]; then set -- "$@" --pr-head "$PR_HEAD"; fi
          if [ "$FORCE" = true ]; then set -- "$@" --force-full; fi
          node scripts/ci/affected-plan.mjs "$@" > "$RUNNER_TEMP/plan-display.json"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "ci-plan-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/plan.json"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
  candidate-build:
    needs: "plan"
    if: "${{ needs.plan.outputs.candidates == 'true' }}"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        uses: "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        with:
          just-version: "1.43.1"
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.3.3"
      -
        name: "Install the pinned npm packer"
        run: "npm install --global npm@11.6.2"
      -
        name: "Freeze canonical packages before qualification"
        run: "node scripts/ci/build-candidates.mjs \"$RUNNER_TEMP/candidates\""
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "candidates-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/candidates"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
  quick-checks:
    name: "Quick development checks"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        uses: "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        with:
          just-version: "1.43.1"
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.3.3"
      -
        run: "bun install --ignore-scripts"
      -
        name: "Check development and release automation"
        run: |
          set -o pipefail
          just test-tooling 2>&1 | tee "$RUNNER_TEMP/tooling.txt"
      -
        name: "Read the exact selection plan"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "ci-plan-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/plan"
      -
        name: "Record observed execution"
        run: "node scripts/ci/job-evidence.mjs --plan \"$RUNNER_TEMP/plan/plan.json\" --id quick-checks --output \"$RUNNER_TEMP/evidence.json\" --transcript \"$RUNNER_TEMP/tooling.txt\""
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "ci-evidence-quick-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/evidence.json"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
    needs: "plan"
    if: "${{ needs.plan.outputs.quick == 'true' }}"
  sites:
    name: "Build public sites"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        uses: "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        with:
          just-version: "1.43.1"
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.3.3"
      -
        run: "bun install --cwd site --frozen-lockfile --ignore-scripts"
      -
        name: "Build separate FLOW and Jig sites"
        run: |
          mkdir "$RUNNER_TEMP/sites"
          scripts/build-site.sh flow "$RUNNER_TEMP/sites/flow"
          scripts/build-site.sh jig "$RUNNER_TEMP/sites/jig"
      -
        name: "Read the exact selection plan"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "ci-plan-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/plan"
      -
        name: "Record observed execution"
        run: "node scripts/ci/job-evidence.mjs --plan \"$RUNNER_TEMP/plan/plan.json\" --id sites --output \"$RUNNER_TEMP/evidence.json\" --pages \"$RUNNER_TEMP/sites\" --profiles flow,jig"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "ci-evidence-sites-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/evidence.json"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
    needs: "plan"
    if: "${{ needs.plan.outputs.sites == 'true' }}"
  python-build:
    name: "Build Python SDK artifacts"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        with:
          python-version: "3.13"
      -
        run: "python -m pip install build==1.3.0 twine==6.2.0 mypy==1.18.2"
      -
        uses: "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        with:
          just-version: "1.43.1"
      -
        run: "python scripts/build-python-sdk.py \"$RUNNER_TEMP/python-dist\" --candidate --build-only"
      -
        name: "Build experimental Python user-updates artifacts"
        run: |
          python -m build --outdir "${{ runner.temp }}/python-updates-dist" packages/jiggy-user-updates
          python -m twine check --strict "${{ runner.temp }}"/python-updates-dist/*
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "python-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/python-dist"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "python-user-updates-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/python-updates-dist"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
      -
        name: "Read the exact selection plan"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "ci-plan-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/plan"
      -
        name: "Check frozen Python distribution identities"
        run: |
          python -c 'import runpy,os; m=runpy.run_path("scripts/pypi-release.py");m["candidate"](__import__("pathlib").Path(os.environ["RUNNER_TEMP"])/"python-dist",os.environ["GITHUB_SHA"])'
          mkdir "$RUNNER_TEMP/python-archives"
          cp "$RUNNER_TEMP"/python-dist/*.whl "$RUNNER_TEMP"/python-dist/*.tar.gz "$RUNNER_TEMP/python-archives/"
          cp "$RUNNER_TEMP"/python-updates-dist/*.whl "$RUNNER_TEMP"/python-updates-dist/*.tar.gz "$RUNNER_TEMP/python-archives/"
      -
        name: "Record observed execution"
        run: "node scripts/ci/job-evidence.mjs --plan \"$RUNNER_TEMP/plan/plan.json\" --id python-build --output \"$RUNNER_TEMP/evidence.json\" --archives \"$RUNNER_TEMP/python-archives\" --profiles jiggy-flow,jiggy-user-updates --artifacts"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "ci-evidence-python-build-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/evidence.json"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
    needs: "plan"
    if: "${{ needs.plan.outputs.python == 'true' }}"
  python-installed:
    name: "Python ${{ matrix.python }} on ${{ matrix.os }}"
    needs:
      - "plan"
      - "python-build"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            os: "ubuntu-24.04"
            python: "3.11"
          -
            os: "ubuntu-24.04"
            python: "3.12"
          -
            os: "ubuntu-24.04"
            python: "3.13"
          -
            os: "ubuntu-24.04"
            python: "3.14"
          -
            os: "macos-14"
            python: "3.14"
          -
            os: "windows-2022"
            python: "3.13"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        with:
          python-version: "${{ matrix.python }}"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "python-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "python-dist"
      -
        run: "python -m pip install mypy==1.18.2"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "python-user-updates-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "python-updates-dist"
      -
        name: "Test installed wheel and sdist"
        shell: "bash"
        run: |
          set -o pipefail
          python packages/jiggy-flow/tests/package_smoke.py python-dist/*.whl python-dist/*.tar.gz 2>&1 | tee -a "$RUNNER_TEMP/python-installed.txt"
      -
        name: "Test installed user-updates wheel and sdist"
        shell: "bash"
        run: |
          set -o pipefail
          python packages/jiggy-user-updates/tests/package_smoke.py python-updates-dist/*.whl python-updates-dist/*.tar.gz python-dist/*.whl 2>&1 | tee -a "$RUNNER_TEMP/python-installed.txt"
      -
        name: "Read the exact selection plan"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "ci-plan-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/plan"
      -
        name: "Record observed execution"
        run: "node scripts/ci/job-evidence.mjs --plan \"$RUNNER_TEMP/plan/plan.json\" --id python-installed --output \"$RUNNER_TEMP/evidence.json\" --transcript \"$RUNNER_TEMP/python-installed.txt\" --artifacts --profile \"${{ matrix.os }}/python-${{ matrix.python }}\""
        shell: "bash"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "ci-evidence-python-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/evidence.json"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
    if: "${{ needs.plan.outputs.python == 'true' }}"
  source-tests:
    name: "Source and package tests"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        with:
          python-version: "3.13"
      -
        uses: "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        with:
          just-version: "1.43.1"
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.3.3"
      -
        name: "Install workspace and fixture dependencies"
        run: |
          bun install --ignore-scripts
          bun install --cwd conformance/run-0 --frozen-lockfile
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0 mypy==1.18.2
      -
        name: "Read the exact selection plan"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "ci-plan-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/plan"
      -
        name: "Read the canonical npm bytes"
        if: "${{ needs.plan.outputs.candidates == 'true' }}"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          node scripts/ci/candidate-transfer.mjs acquire "$RUNNER_TEMP/candidates" --source "$GITHUB_SHA" --producer-run "$GITHUB_RUN_ID" --timeout-seconds 0
          printf 'CI_CANDIDATE_BUNDLE=%s\n' "$RUNNER_TEMP/candidates" >> "$GITHUB_ENV"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "python-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/python-dist"
      -
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "python-user-updates-candidate-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/python-updates-dist"
      -
        name: "Run source, conformance, and package gates"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          JIG_CI_SOURCE_JUNIT: "${{ runner.temp }}/source-tests.xml"
          CI_PYTHON_DISTRIBUTIONS: "${{ runner.temp }}/python-dist"
          CI_PYTHON_UPDATES_DISTRIBUTIONS: "${{ runner.temp }}/python-updates-dist"
        run: |
          set -o pipefail
          FLOW_NODE=$(command -v node)
          PYTHON=$(command -v python)
          export FLOW_NODE PYTHON
          scripts/test-release.sh 2>&1 | tee "$RUNNER_TEMP/source-transcript.txt"
      -
        name: "Record observed execution"
        run: "node scripts/ci/job-evidence.mjs --plan \"$RUNNER_TEMP/plan/plan.json\" --id source-tests --output \"$RUNNER_TEMP/evidence.json\" --junit \"$RUNNER_TEMP/source-tests.xml\" --python-transcript \"$RUNNER_TEMP/source-transcript.txt\" --skip-policy source-platform-opt-in"
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "ci-evidence-source-${{ github.sha }}-a${{ github.run_attempt }}"
          path: |
            ${{ runner.temp }}/evidence.json
            ${{ runner.temp }}/source-tests.xml
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
    needs:
      - "plan"
      - "candidate-build"
      - "python-build"
    if: "${{ always() && needs.plan.result == 'success' && needs.plan.outputs.source == 'true' && (needs.candidate-build.result == 'success' || needs.candidate-build.result == 'skipped') && needs.python-build.result == 'success' }}"
    permissions:
      contents: "read"
      actions: "read"
  npm-candidate:
    name: "Build ${{ matrix.package }} release candidate"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.plan.outputs.npm_matrix) }}"
    env:
      RELEASE_PACKAGE: "${{ matrix.package }}"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        uses: "extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b"
        with:
          just-version: "1.43.1"
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.3.3"
      -
        name: "Read the exact selection plan"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "ci-plan-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/plan"
      -
        name: "Install the pinned npm qualifier"
        run: "npm install --global npm@11.6.2"
      -
        name: "Read the canonical candidate bytes"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: "node scripts/ci/candidate-transfer.mjs acquire \"$RUNNER_TEMP/candidates\" --source \"$GITHUB_SHA\" --producer-run \"$GITHUB_RUN_ID\" --timeout-seconds 0"
      -
        name: "Build source workspace dependencies"
        run: |
          bun install --ignore-scripts
          just jig::build
      -
        name: "Provision Jig's disposable rootless host"
        id: "jig_host"
        if: "${{ matrix.package == 'jig' }}"
        run: |
          set -eu
          JIG_CI_BUN=$(command -v bun)
          export JIG_CI_BUN
          scripts/ci/provision-github-rootless-host.sh provision
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      -
        name: "Qualify the frozen candidate"
        run: |
          set -eu
          FLOW_NODE=$(command -v node)
          FLOW_NPM=$(command -v npm)
          JIG_NPM=$FLOW_NPM
          export FLOW_NODE FLOW_NPM JIG_NPM
          node scripts/ci/qualify-candidate.mjs "$RELEASE_PACKAGE" "$RUNNER_TEMP/candidates" "$RUNNER_TEMP/qualification.json"
          case "$RELEASE_PACKAGE" in flow) kind=flow-sdk;; agent) kind=agent-method;; acp) kind=agent-acp;; jig) kind=jig;; esac
          printf 'CANDIDATE_DIRECTORY=%s\n' "$RUNNER_TEMP/candidates/$kind" >> "$GITHUB_ENV"
          version=$(node -p 'require(process.env.RUNNER_TEMP+"/candidates/"+process.env.RELEASE_PACKAGE.replace("flow","flow-sdk").replace("agent","agent-method").replace("acp","agent-acp")+"/SUCCESS.json").version')
          printf 'artifact_name=npm-candidate-%s-%s-%s\n' "$RELEASE_PACKAGE" "$version" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        id: "qualified"
      -
        name: "Require zero Jig host residue"
        if: "${{ always() && steps.jig_host.outputs.ready == 'true' }}"
        run: "scripts/ci/provision-github-rootless-host.sh assert-clean"
      -
        name: "Upload exact candidate"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "${{ steps.qualified.outputs.artifact_name }}"
          path: "${{ env.CANDIDATE_DIRECTORY }}"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
      -
        name: "Check immutable registry version before merge"
        env:
          SOURCE_REVISION: "${{ github.sha }}"
        run: "node scripts/ci/npm-candidate-preflight.mjs \"$CANDIDATE_DIRECTORY\""
      -
        name: "Record observed execution"
        run: "node scripts/ci/job-evidence.mjs --plan \"$RUNNER_TEMP/plan/plan.json\" --id npm-candidate --output \"$RUNNER_TEMP/evidence.json\" --qualification \"$RUNNER_TEMP/qualification.json\" --artifacts --profile \"${{ matrix.package }}\""
      -
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "ci-evidence-npm-${{ matrix.package }}-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/evidence.json"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
    needs:
      - "plan"
      - "candidate-build"
    if: "${{ needs.plan.outputs.candidates == 'true' }}"
    permissions:
      contents: "read"
      actions: "read"
  test:
    if: "always()"
    needs:
      - "plan"
      - "quick-checks"
      - "sites"
      - "source-tests"
      - "candidate-build"
      - "python-build"
      - "python-installed"
      - "npm-candidate"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    permissions:
      contents: "read"
      actions: "read"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          persist-credentials: false
          fetch-depth: 0
      -
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020"
        with:
          node-version: "24"
      -
        name: "Read the exact selection plan"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "ci-plan-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/plan"
      -
        name: "Download observed target evidence"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          pattern: "ci-evidence-*-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/evidence"
      -
        name: "Require the planned work and observed execution"
        env:
          JOB_RESULTS: "${{ toJSON(needs) }}"
          MODE: "${{ vars.JIG_CI_SELECTION_MODE || 'shadow' }}"
          FORCE: "${{ vars.JIG_CI_FORCE_FULL || 'false' }}"
        run: |
          set -eu
          node --input-type=module -e 'import{writeFileSync}from"node:fs";const n=JSON.parse(process.env.JOB_RESULTS);if(n.plan.result!=="success"||!["success","skipped"].includes(n["candidate-build"].result))process.exit(1);writeFileSync(process.env.RUNNER_TEMP+"/results.json",JSON.stringify(Object.fromEntries(Object.entries(n).map(([k,v])=>[k,v.result]))));'
          node scripts/ci/job-evidence.mjs --plan "$RUNNER_TEMP/plan/plan.json" --directory "$RUNNER_TEMP/evidence" --results "$RUNNER_TEMP/results.json" --output "$RUNNER_TEMP/combined.json"
          node scripts/ci/affected-gate.mjs --plan "$RUNNER_TEMP/plan/plan.json" --evidence "$RUNNER_TEMP/combined.json" --scope ci > "$RUNNER_TEMP/affected-summary.json"
      -
        name: "Retain selection audit and execution evidence"
        if: "always()"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "ci-selection-audit-${{ github.sha }}-a${{ github.run_attempt }}"
          path: "${{ runner.temp }}/*.json"
          retention-days: 7
          if-no-files-found: "error"
          overwrite: true
