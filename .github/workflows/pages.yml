name: Jig Pages
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - site/bun.lock
      - site/package.json
      - site/justfile
      - site/theme/**
      - site/landing.css
      - site/jig/**
      - docs/jig/**
      - packages/reporting/src/reporting.json
      - packages/reporting/LICENSE
      - scripts/build-site.sh
      - scripts/promote-directory.mjs
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install frozen documentation dependencies
        run: bun install --cwd site --frozen-lockfile --ignore-scripts
      - name: Build static Pages artifact
        run: scripts/build-site.sh jig "$RUNNER_TEMP/pages"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
