# Temporary experiment branch only. No native or release qualification.
name: Artifact first-claim service control
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  candidates:
    name: Claim candidate — ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        candidate: [alpha, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Bind actual allocated job and rendezvous before contention
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ matrix.candidate }}
        run: node scripts/ci/artifact-claim-service-control.mjs prepare
      - name: Upload competing immutable claim
        id: claim
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claim-service-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/claim-control/CLAIM.json
          overwrite: false
          if-no-files-found: error
          retention-days: 1
      - name: Preserve actual upload outcome without qualification claims
        env:
          UPLOAD_OUTCOME: ${{ steps.claim.outcome }}
          ARTIFACT_ID: ${{ steps.claim.outputs.artifact-id }}
        run: node scripts/ci/artifact-claim-service-control.mjs outcome
      - name: Retain candidate observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claim-outcome-${{ matrix.candidate }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/claim-outcome/OUTCOME.json
          if-no-files-found: error
          retention-days: 1
  ignored-command-failure:
    name: Job-level tolerated command failure (control)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Deliberate failed command retains raw failure
        run: exit 17
  verify:
    name: Verify finalized claim and fail-closed refusal
    needs: [candidates, ignored-command-failure]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify actual immutable winner and all candidate executions
        env:
          GH_TOKEN: ${{ github.token }}
          IGNORED_JOB_NEEDS_RESULT: ${{ needs.ignored-command-failure.result }}
        run: node scripts/ci/artifact-claim-service-control.mjs verify
      - name: Retain platform-only control report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claim-control-report-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/claim-control-report/REPORT.json
          if-no-files-found: error
          retention-days: 1
