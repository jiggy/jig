name: CI orchestration probe
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Observe real queueing and matrix cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/orchestration-probe.mjs
      - name: Cancel any unfinished diagnostic child
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_CANCEL_ONLY: '1'
        run: node scripts/ci/orchestration-probe.mjs
