name: Release rehearsal
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'packages/**'
      - '.changeset/**'
      - 'package.json'
      - 'justfile'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    name: Version, publish, retry and install in a disposable registry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: '1.43.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - name: Install the same npm packer as canonical CI
        run: |
          npm_prefix=$(mktemp -d "$RUNNER_TEMP/npm.XXXXXX")
          npm install --global --prefix "$npm_prefix" --ignore-scripts npm@11.6.2
          test "$("$npm_prefix/bin/npm" --version)" = 11.6.2
          printf '%s\n' "$npm_prefix/bin" >> "$GITHUB_PATH"
      - run: bun install --ignore-scripts
      - run: just test-release-rehearsal
