name: macOS host conformance

# Personal or dedicated Mac runners must never execute untrusted PR code.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-host-conformance
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'jiggy/jig' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mac-support')
    environment: macos-host-conformance
    runs-on: [self-hosted, macOS, X64, jig-macos-23E224]
    timeout-minutes: 90
    env:
      JIG_CODEX_STARTUP_PATH: ${{ vars.JIG_CODEX_STARTUP_PATH }}
      JIG_CLAUDE_STARTUP_PATH: ${{ vars.JIG_CLAUDE_STARTUP_PATH }}
      JIG_PI_STARTUP_PATH: ${{ vars.JIG_PI_STARTUP_PATH }}
    steps:
      - name: Check out the exact approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.43.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Record candidate identity
        run: |
          git rev-parse HEAD
          uname -a
          sw_vers
          bun --revision
      - name: Require the exact rootless candidate host and native clients
        run: scripts/ci/qualify-macos-host.sh --preflight
      - name: Install build dependencies without lifecycle scripts
        run: bun install --ignore-scripts --filter @jigging/jig --filter @jigging/agent-method --filter @jigging/agent-acp --filter @jigging/flow-authoring --filter @jigging/flow
      - name: Build candidate
        run: just --justfile packages/jig/justfile build
      - name: Qualify rootless host and installed consumer
        run: scripts/ci/qualify-macos-host.sh
