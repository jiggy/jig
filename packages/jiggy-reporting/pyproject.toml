[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiggy-reporting"
version = "0.1.0a1"
description = "Report progress, messages and application views through a portable FLOW channel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jiggy-flow==0.1.0a7"]
license = "MPL-2.0"
license-files = ["LICENSE"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jiggy.reporting*"]
namespaces = true

[tool.setuptools.package-data]
"jiggy.reporting" = ["py.typed", "reporting.json"]
