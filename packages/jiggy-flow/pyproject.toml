[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiggy-flow"
version = "0.1.0a2"
description = "Python SDK for FLOW Run/1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://flow.jig.md/guide/python"
Source = "https://github.com/jiggy/jig/tree/main/packages/jiggy-flow"
Issues = "https://github.com/jiggy/jig/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jiggy.flow*"]
namespaces = true

[tool.setuptools.package-data]
"jiggy.flow" = ["py.typed"]
